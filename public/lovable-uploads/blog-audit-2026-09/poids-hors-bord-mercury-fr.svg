<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" xml:lang="fr" aria-labelledby="title desc">
  <title id="title">Poids du hors-bord</title>
  <desc id="desc">Poids sec publié, équipements et fluides à ajouter, puis vérification des limites de la coque.</desc>
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <text x="600" y="88" text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700">Poids du hors-bord</text>
  <rect x="540" y="108" width="120" height="6" rx="3" fill="#C8102E"/>

  <rect x="56" y="168" width="336" height="400" rx="20" fill="#F7F9FC" stroke="#0B1F3A" stroke-width="4"/>
  <circle cx="224" cy="236" r="36" fill="#0B1F3A"/>
  <text x="224" y="248" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">1</text>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="600">
    <tspan x="224" y="340">Poids sec</tspan>
    <tspan x="224" dy="56">publié</tspan>
  </text>

  <polygon points="414,358 444,378 414,398" fill="#0B1F3A" aria-hidden="true"/>

  <rect x="432" y="168" width="336" height="400" rx="20" fill="#F7F9FC" stroke="#0B1F3A" stroke-width="4"/>
  <circle cx="600" cy="236" r="36" fill="#0B1F3A"/>
  <text x="600" y="248" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">2</text>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="600">
    <tspan x="600" y="340">Équipements</tspan>
    <tspan x="600" dy="56">et fluides</tspan>
  </text>

  <polygon points="790,358 820,378 790,398" fill="#0B1F3A" aria-hidden="true"/>

  <rect x="808" y="168" width="336" height="400" rx="20" fill="#F7F9FC" stroke="#0B1F3A" stroke-width="4"/>
  <circle cx="976" cy="236" r="36" fill="#0B1F3A"/>
  <text x="976" y="248" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">3</text>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="600">
    <tspan x="976" y="340">Limites de</tspan>
    <tspan x="976" dy="56">la coque</tspan>
  </text>

  <rect x="56" y="612" width="1088" height="132" rx="18" fill="#EEF2F6"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="600">
    <tspan x="600" y="664">Le poids sec n’est pas</tspan>
    <tspan x="600" dy="48">le poids total installé.</tspan>
  </text>
</svg>
