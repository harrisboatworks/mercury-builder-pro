<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">Maintenance parts follow the serial</title>
  <desc id="desc">Concept diagram: find the serial first, then the part category, then confirm before ordering. Horsepower on the cowl is not enough.</desc>
  <rect width="1200" height="800" fill="#F4EFE4"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700">
    <tspan x="600" y="86">Maintenance parts</tspan>
    <tspan x="600" dy="80">follow the serial</tspan>
  </text>
  <rect x="540" y="186" width="120" height="6" rx="3" fill="#C8102E"/>

  <rect x="48" y="214" width="1104" height="108" rx="22" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <circle cx="116" cy="268" r="36" fill="#0B1F3A"/>
  <text x="116" y="280" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700">1</text>
  <rect x="168" y="236" width="56" height="64" rx="8" fill="#0B1F3A"/>
  <rect x="176" y="248" width="40" height="8" rx="2" fill="#F4EFE4"/>
  <rect x="176" y="264" width="28" height="6" rx="2" fill="#EDE6D6"/>
  <rect x="176" y="278" width="34" height="6" rx="2" fill="#EDE6D6"/>
  <text x="248" y="280" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">Find the serial</text>

  <polygon points="584,328 616,328 600,350" fill="#0B1F3A"/>

  <rect x="48" y="360" width="1104" height="196" rx="22" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <circle cx="116" cy="416" r="36" fill="#0B1F3A"/>
  <text x="116" y="428" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700">2</text>
  <text x="172" y="428" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">Identify the category</text>
  <rect x="80" y="460" width="200" height="68" rx="34" fill="#0B1F3A"/>
  <text x="180" y="504" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="600">filter</text>
  <rect x="296" y="460" width="220" height="68" rx="34" fill="#0B1F3A"/>
  <text x="406" y="504" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="600">impeller</text>
  <rect x="532" y="460" width="200" height="68" rx="34" fill="#0B1F3A"/>
  <text x="632" y="504" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="600">anode</text>
  <rect x="748" y="460" width="180" height="68" rx="34" fill="#0B1F3A"/>
  <text x="838" y="504" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="600">plug</text>
  <rect x="944" y="460" width="176" height="68" rx="34" fill="#C8102E"/>
  <text x="1032" y="504" text-anchor="middle" fill="#FFFBF3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="600">kit</text>

  <polygon points="584,560 616,560 600,582" fill="#0B1F3A"/>

  <rect x="48" y="590" width="1104" height="80" rx="22" fill="#0B1F3A"/>
  <circle cx="116" cy="630" r="28" fill="#F4EFE4"/>
  <text x="116" y="640" text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">3</text>
  <text x="168" y="644" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">Confirm before you order</text>

  <rect x="48" y="684" width="1104" height="84" rx="20" fill="#EDE6D6"/>
  <text x="600" y="738" text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="600">Serial breaks change parts.</text>
</svg>
