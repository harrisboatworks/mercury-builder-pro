<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">What a trade appraisal looks at</title>
  <desc id="desc">Concept diagram of trade-appraisal factors: brand, hours and age, visible condition, service history, and resale path.</desc>
  <rect width="1200" height="800" fill="#F4EFE4"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700">
    <tspan x="600" y="86">What a trade</tspan>
    <tspan x="600" dy="80">appraisal looks at</tspan>
  </text>
  <rect x="540" y="186" width="120" height="6" rx="3" fill="#C8102E"/>

  <rect x="48" y="214" width="352" height="200" rx="22" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <rect x="176" y="236" width="96" height="40" rx="8" fill="#0B1F3A"/>
  <text x="224" y="266" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">Aa</text>
  <text x="224" y="354" text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">Brand</text>

  <rect x="424" y="214" width="352" height="200" rx="22" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <circle cx="600" cy="256" r="22" fill="#0B1F3A"/>
  <path d="M600 244 V256 L612 264" fill="none" stroke="#F4EFE4" stroke-width="4" stroke-linecap="round"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="600" y="328">Hours</tspan>
    <tspan x="600" dy="52">and age</tspan>
  </text>

  <rect x="800" y="214" width="352" height="200" rx="22" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <circle cx="976" cy="256" r="22" fill="#0B1F3A"/>
  <circle cx="976" cy="256" r="8" fill="#F4EFE4"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="976" y="328">Visible</tspan>
    <tspan x="976" dy="52">condition</tspan>
  </text>

  <rect x="48" y="438" width="540" height="200" rx="22" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <rect x="268" y="460" width="100" height="40" rx="6" fill="#0B1F3A"/>
  <rect x="280" y="472" width="76" height="6" rx="2" fill="#F4EFE4"/>
  <rect x="280" y="484" width="52" height="6" rx="2" fill="#EDE6D6"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="318" y="554">Service</tspan>
    <tspan x="318" dy="52">history</tspan>
  </text>

  <rect x="612" y="438" width="540" height="200" rx="22" fill="#FFFBF3" stroke="#C8102E" stroke-width="4"/>
  <path d="M852 460 L892 500 L932 460" fill="none" stroke="#C8102E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="882" y="554">How it can</tspan>
    <tspan x="882" dy="52">be resold</tspan>
  </text>

  <rect x="48" y="668" width="1104" height="100" rx="20" fill="#EDE6D6"/>
  <text x="600" y="732" text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="600">There is no outboard blue book.</text>
</svg>
