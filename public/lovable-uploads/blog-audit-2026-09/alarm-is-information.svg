<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">An alarm is information, not a diagnosis</title>
  <desc id="desc">Concept diagram: if an alarm sounds, read the display text, count the horn pattern, stop if unsure, and book a diagnostic.</desc>
  <rect width="1200" height="800" fill="#F4EFE4"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700">
    <tspan x="600" y="86">An alarm is information,</tspan>
    <tspan x="600" dy="80">not a diagnosis.</tspan>
  </text>
  <rect x="540" y="186" width="120" height="6" rx="3" fill="#C8102E"/>

  <rect x="48" y="214" width="1104" height="132" rx="22" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <circle cx="116" cy="280" r="40" fill="#C8102E"/>
  <path d="M102 280 H130" stroke="#FFFBF3" stroke-width="6" stroke-linecap="round"/>
  <path d="M138 264 C150 280 150 280 138 296" fill="none" stroke="#C8102E" stroke-width="6" stroke-linecap="round"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="184" y="268">Warning text</tspan>
    <tspan x="184" dy="56">and horn pattern</tspan>
  </text>


  <rect x="48" y="384" width="1104" height="132" rx="22" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <rect x="76" y="416" width="80" height="68" rx="10" fill="#0B1F3A"/>
  <rect x="88" y="432" width="56" height="8" rx="2" fill="#F4EFE4"/>
  <rect x="88" y="448" width="40" height="8" rx="2" fill="#EDE6D6"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="184" y="438">Engine model</tspan>
    <tspan x="184" dy="56">and serial number</tspan>
  </text>


  <rect x="48" y="554" width="1104" height="104" rx="22" fill="#0B1F3A"/>
  <rect x="84" y="582" width="56" height="48" rx="8" fill="#F4EFE4"/>
  <rect x="96" y="596" width="32" height="6" rx="2" fill="#0B1F3A"/>
  <rect x="96" y="608" width="24" height="6" rx="2" fill="#C8102E"/>
  <text fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="168" y="620">Exact manual response and service</tspan>
  </text>

  <rect x="48" y="684" width="1104" height="84" rx="20" fill="#EDE6D6"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="600">
    <tspan x="600" y="718">Follow the warning response immediately.</tspan>
    <tspan x="600" dy="40">Record details only when safe.</tspan>
  </text>
</svg>
