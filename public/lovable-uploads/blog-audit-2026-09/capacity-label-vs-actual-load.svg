<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">Capacity label vs actual load</title>
  <desc id="desc">Concept diagram: a hull notice lists people, recommended engine power and load limits; weather, motor weight and the actual hull still have to be checked.</desc>
  <rect width="1200" height="800" fill="#F4EFE4"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700">
    <tspan x="600" y="86">Capacity label vs</tspan>
    <tspan x="600" dy="80">actual load</tspan>
  </text>
  <rect x="540" y="186" width="120" height="6" rx="3" fill="#C8102E"/>

  <rect x="48" y="216" width="528" height="424" rx="24" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <rect x="48" y="216" width="528" height="16" rx="8" fill="#0B1F3A"/>
  <rect x="48" y="224" width="528" height="8" fill="#0B1F3A"/>

  <rect x="80" y="256" width="64" height="64" rx="16" fill="#0B1F3A"/>
  <circle cx="112" cy="280" r="10" fill="#F4EFE4"/>
  <rect x="98" y="296" width="28" height="6" rx="3" fill="#F4EFE4"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="164" y="300">People limit</tspan>
  </text>

  <rect x="80" y="360" width="464" height="2" fill="#E8E0D0"/>
  <rect x="80" y="388" width="64" height="64" rx="16" fill="#0B1F3A"/>
  <path d="M100 428 V404 H124 V428" fill="none" stroke="#F4EFE4" stroke-width="5" stroke-linejoin="round"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="164" y="418">Recommended max</tspan>
    <tspan x="164" dy="52">engine power</tspan>
  </text>

  <rect x="80" y="500" width="464" height="2" fill="#E8E0D0"/>
  <rect x="80" y="528" width="64" height="64" rx="16" fill="#0B1F3A"/>
  <rect x="96" y="552" width="32" height="16" rx="3" fill="#F4EFE4"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="164" y="572">Maximum load</tspan>
  </text>

  <rect x="624" y="216" width="528" height="424" rx="24" fill="#FFFBF3" stroke="#C8102E" stroke-width="4"/>
  <rect x="624" y="216" width="528" height="16" rx="8" fill="#C8102E"/>
  <rect x="624" y="224" width="528" height="8" fill="#C8102E"/>

  <rect x="656" y="256" width="64" height="64" rx="16" fill="#C8102E"/>
  <path d="M668 296 C676 276 700 276 708 296" fill="none" stroke="#FFFBF3" stroke-width="5" stroke-linecap="round"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="740" y="286">Weather or water</tspan>
    <tspan x="740" dy="52">can require less</tspan>
  </text>

  <rect x="656" y="368" width="464" height="2" fill="#E8E0D0"/>
  <rect x="656" y="388" width="64" height="64" rx="16" fill="#C8102E"/>
  <circle cx="688" cy="420" r="14" fill="none" stroke="#FFFBF3" stroke-width="5"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="740" y="418">Motor weight and</tspan>
    <tspan x="740" dy="52">rigging still need</tspan>
    <tspan x="740" dy="52">checking</tspan>
  </text>

  <rect x="656" y="548" width="464" height="2" fill="#E8E0D0"/>
  <rect x="656" y="556" width="64" height="60" rx="16" fill="#C8102E"/>
  <rect x="672" y="572" width="32" height="28" rx="4" fill="#FFFBF3"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="740" y="580">Read this</tspan>
    <tspan x="740" y="628">hull only</tspan>
  </text>

  <rect x="48" y="668" width="1104" height="100" rx="20" fill="#EDE6D6"/>
  <text x="600" y="732" text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="600">Do not copy another boat&#8217;s numbers.</text>
</svg>
