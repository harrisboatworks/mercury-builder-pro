<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">Three prices, not one</title>
  <desc id="desc">Concept diagram: bare-motor price, boat-specific work, and the out-the-door total are three different numbers.</desc>
  <rect width="1200" height="800" fill="#F4EFE4"/>
  <text x="600" y="110" text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700">Three prices, not one</text>
  <rect x="540" y="136" width="120" height="6" rx="3" fill="#C8102E"/>

  <rect x="260" y="176" width="680" height="132" rx="24" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <text x="600" y="256" text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">Bare-motor price</text>

  <polygon points="580,316 620,316 600,338" fill="#0B1F3A"/>

  <rect x="168" y="346" width="864" height="132" rx="24" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <text x="600" y="426" text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">Boat-specific work</text>

  <polygon points="580,486 620,486 600,508" fill="#0B1F3A"/>

  <rect x="48" y="516" width="1104" height="140" rx="24" fill="#0B1F3A"/>
  <text x="600" y="600" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700">Out-the-door total</text>

  <rect x="48" y="684" width="1104" height="84" rx="20" fill="#EDE6D6"/>
  <text x="600" y="738" text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="600">A low motor-only price is not an installed quote.</text>
</svg>
