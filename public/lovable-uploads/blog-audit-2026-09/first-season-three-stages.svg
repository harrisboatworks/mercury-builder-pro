<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">First season, three stages</title>
  <desc id="desc">Concept diagram of a first season: dealer pre-delivery inspection, on-water break-in, then the first scheduled service.</desc>
  <rect width="1200" height="800" fill="#F4EFE4"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700">
    <tspan x="600" y="86">First season,</tspan>
    <tspan x="600" dy="80">three stages</tspan>
  </text>
  <rect x="540" y="186" width="120" height="6" rx="3" fill="#C8102E"/>

  <line x1="224" y1="280" x2="976" y2="280" stroke="#0B1F3A" stroke-width="6"/>
  <circle cx="224" cy="280" r="36" fill="#0B1F3A"/>
  <text x="224" y="292" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">1</text>
  <circle cx="600" cy="280" r="36" fill="#0B1F3A"/>
  <text x="600" y="292" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">2</text>
  <circle cx="976" cy="280" r="36" fill="#C8102E"/>
  <text x="976" y="292" text-anchor="middle" fill="#FFFBF3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">3</text>

  <rect x="48" y="348" width="352" height="288" rx="24" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <rect x="160" y="380" width="128" height="80" rx="12" fill="#0B1F3A"/>
  <path d="M184 424 L208 400 L232 424 L256 400" fill="none" stroke="#F4EFE4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="224" y="516">Dealer</tspan>
    <tspan x="224" dy="56">PDI</tspan>
  </text>

  <rect x="424" y="348" width="352" height="288" rx="24" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <path d="M496 420 C536 400 568 440 608 420 C648 400 680 440 704 420" fill="none" stroke="#0B1F3A" stroke-width="8" stroke-linecap="round"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="600" y="516">On-water</tspan>
    <tspan x="600" dy="56">break-in</tspan>
  </text>

  <rect x="800" y="348" width="352" height="288" rx="24" fill="#FFFBF3" stroke="#C8102E" stroke-width="4"/>
  <circle cx="976" cy="420" r="32" fill="#C8102E"/>
  <path d="M976 404 V420 L992 428" fill="none" stroke="#FFFBF3" stroke-width="5" stroke-linecap="round"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="976" y="504">First</tspan>
    <tspan x="976" dy="52">scheduled</tspan>
    <tspan x="976" dy="52">service</tspan>
  </text>

  <rect x="48" y="668" width="1104" height="100" rx="20" fill="#EDE6D6"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="600">
    <tspan x="600" y="710">Follow the serial-specific manual.</tspan>
    <tspan x="600" dy="44">Early oil change is optional dealer practice.</tspan>
  </text>
</svg>
