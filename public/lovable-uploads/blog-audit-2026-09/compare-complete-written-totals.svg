<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">Compare complete written totals</title>
  <desc id="desc">Concept diagram comparing a complete installed-repower total with a complete new-package total, after hull suitability.</desc>
  <rect width="1200" height="800" fill="#F4EFE4"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700">
    <tspan x="600" y="86">Compare complete</tspan>
    <tspan x="600" dy="80">written totals</tspan>
  </text>
  <rect x="540" y="186" width="120" height="6" rx="3" fill="#C8102E"/>

  <rect x="48" y="214" width="528" height="444" rx="24" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <rect x="48" y="214" width="528" height="88" rx="24" fill="#0B1F3A"/>
  <rect x="48" y="278" width="528" height="24" fill="#0B1F3A"/>
  <text x="312" y="272" text-anchor="middle" fill="#F4EFE4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700">Installed repower</text>

  <rect x="80" y="332" width="16" height="16" rx="4" fill="#C8102E"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="116" y="352">motor and</tspan>
    <tspan x="116" dy="52">required work</tspan>
  </text>
  <rect x="80" y="430" width="464" height="2" fill="#E8E0D0"/>
  <rect x="80" y="458" width="16" height="16" rx="4" fill="#C8102E"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="116" y="478">rigging that</tspan>
    <tspan x="116" dy="52">must change</tspan>
  </text>
  <rect x="80" y="556" width="464" height="2" fill="#E8E0D0"/>
  <rect x="80" y="576" width="16" height="16" rx="4" fill="#C8102E"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="116" y="592">HST, trade,</tspan>
    <tspan x="116" y="640">exclusions</tspan>
  </text>

  <rect x="624" y="214" width="528" height="444" rx="24" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <rect x="624" y="214" width="528" height="88" rx="24" fill="#C8102E"/>
  <rect x="624" y="278" width="528" height="24" fill="#C8102E"/>
  <text x="888" y="272" text-anchor="middle" fill="#FFFBF3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700">New package</text>

  <rect x="656" y="332" width="16" height="16" rx="4" fill="#0B1F3A"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="692" y="352">hull, motor,</tspan>
    <tspan x="692" dy="52">trailer</tspan>
  </text>
  <rect x="656" y="430" width="464" height="2" fill="#E8E0D0"/>
  <rect x="656" y="458" width="16" height="16" rx="4" fill="#0B1F3A"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="692" y="478">fit and upgrade</tspan>
    <tspan x="692" dy="52">changes</tspan>
  </text>
  <rect x="656" y="556" width="464" height="2" fill="#E8E0D0"/>
  <rect x="656" y="576" width="16" height="16" rx="4" fill="#0B1F3A"/>
  <text fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="692" y="592">HST, trade,</tspan>
    <tspan x="692" y="640">exclusions</tspan>
  </text>

  <rect x="48" y="668" width="1104" height="100" rx="20" fill="#EDE6D6"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="600">
    <tspan x="600" y="710">Hull suitability first.</tspan>
    <tspan x="600" dy="44">A checklist does not pick the path.</tspan>
  </text>
</svg>
