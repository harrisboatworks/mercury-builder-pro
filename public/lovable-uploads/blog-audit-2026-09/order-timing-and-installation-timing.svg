<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">Order timing and installation timing</title>
  <desc id="desc">Concept diagram of two buying levers: when you order versus when the shop can install, with promotions confirmed separately.</desc>
  <rect width="1200" height="800" fill="#F4EFE4"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700">
    <tspan x="600" y="86">Order timing and</tspan>
    <tspan x="600" dy="80">installation timing</tspan>
  </text>
  <rect x="540" y="186" width="120" height="6" rx="3" fill="#C8102E"/>

  <rect x="48" y="214" width="528" height="424" rx="24" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <rect x="216" y="252" width="192" height="160" rx="20" fill="#0B1F3A"/>
  <rect x="240" y="276" width="144" height="24" rx="4" fill="#F4EFE4"/>
  <rect x="252" y="316" width="32" height="28" rx="4" fill="#EDE6D6"/>
  <rect x="292" y="316" width="32" height="28" rx="4" fill="#EDE6D6"/>
  <rect x="332" y="316" width="32" height="28" rx="4" fill="#C8102E"/>
  <rect x="252" y="356" width="32" height="28" rx="4" fill="#EDE6D6"/>
  <rect x="292" y="356" width="32" height="28" rx="4" fill="#EDE6D6"/>
  <rect x="332" y="356" width="32" height="28" rx="4" fill="#EDE6D6"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="312" y="480">Orders and planning</tspan>
    <tspan x="312" dy="56">can happen</tspan>
    <tspan x="312" dy="56">remotely</tspan>
  </text>

  <rect x="624" y="214" width="528" height="424" rx="24" fill="#FFFBF3" stroke="#0B1F3A" stroke-width="4"/>
  <rect x="792" y="252" width="192" height="160" rx="20" fill="#C8102E"/>
  <rect x="848" y="292" width="80" height="80" rx="12" fill="#FFFBF3"/>
  <path d="M868 332 H908 M888 312 V352" stroke="#0B1F3A" stroke-width="8" stroke-linecap="round"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="600">
    <tspan x="888" y="480">Physical work</tspan>
    <tspan x="888" dy="56">happens when the</tspan>
    <tspan x="888" dy="56">marina is open</tspan>
  </text>

  <rect x="48" y="668" width="1104" height="100" rx="20" fill="#EDE6D6"/>
  <text text-anchor="middle" fill="#0B1F3A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="600">
    <tspan x="600" y="710">Closed December 1 through April 1.</tspan>
    <tspan x="600" dy="44">Confirm current offers separately.</tspan>
  </text>
</svg>
