<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The five-minute boat trailer check</title>
  <desc id="desc">Six checks before towing: coupler, chains, bow and transom restraints, tires, wheels, and lights.</desc>
  <rect width="1200" height="760" rx="36" fill="#071b33"/>
  <path d="M0 0h1200v12H0z" fill="#c9972b"/>
  <text x="72" y="88" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">The five-minute trailer check</text>
  <text x="72" y="130" fill="#b9c9d9" font-family="Arial, sans-serif" font-size="23">Do this before every trip. Use the trailer manual for specifications.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(72 182)">
      <rect width="330" height="202" rx="22" fill="#102b4a" stroke="#315b7e"/>
      <circle cx="48" cy="52" r="25" fill="#16a6a1"/><text x="48" y="61" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">1</text>
      <text x="88" y="59" fill="#fff" font-size="27" font-weight="700">Coupler</text>
      <text x="30" y="110" fill="#dbe7f1" font-size="21">Correct ball size, fully seated,</text>
      <text x="30" y="143" fill="#dbe7f1" font-size="21">latched and locked.</text>
      <text x="30" y="178" fill="#efc760" font-size="18">Stop if it will not lock securely.</text>
    </g>
    <g transform="translate(435 182)">
      <rect width="330" height="202" rx="22" fill="#102b4a" stroke="#315b7e"/>
      <circle cx="48" cy="52" r="25" fill="#16a6a1"/><text x="48" y="61" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">2</text>
      <text x="88" y="59" fill="#fff" font-size="27" font-weight="700">Chains</text>
      <text x="30" y="110" fill="#dbe7f1" font-size="21">Two attachment methods.</text>
      <text x="30" y="143" fill="#dbe7f1" font-size="21">Cross chains under the tongue.</text>
      <text x="30" y="178" fill="#efc760" font-size="18">Hooks latched, road clearance kept.</text>
    </g>
    <g transform="translate(798 182)">
      <rect width="330" height="202" rx="22" fill="#102b4a" stroke="#315b7e"/>
      <circle cx="48" cy="52" r="25" fill="#16a6a1"/><text x="48" y="61" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">3</text>
      <text x="88" y="59" fill="#fff" font-size="27" font-weight="700">Boat restraints</text>
      <text x="30" y="110" fill="#dbe7f1" font-size="21">Bow eye secured separately.</text>
      <text x="30" y="143" fill="#dbe7f1" font-size="21">Transom straps tight and sound.</text>
      <text x="30" y="178" fill="#efc760" font-size="18">The winch strap is not enough.</text>
    </g>
    <g transform="translate(72 418)">
      <rect width="330" height="202" rx="22" fill="#102b4a" stroke="#315b7e"/>
      <circle cx="48" cy="52" r="25" fill="#16a6a1"/><text x="48" y="61" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">4</text>
      <text x="88" y="59" fill="#fff" font-size="27" font-weight="700">Tires</text>
      <text x="30" y="110" fill="#dbe7f1" font-size="21">Check cold pressure and damage.</text>
      <text x="30" y="143" fill="#dbe7f1" font-size="21">Use the installed tire specification.</text>
      <text x="30" y="178" fill="#efc760" font-size="18">Cracks or bulges mean stop.</text>
    </g>
    <g transform="translate(435 418)">
      <rect width="330" height="202" rx="22" fill="#102b4a" stroke="#315b7e"/>
      <circle cx="48" cy="52" r="25" fill="#16a6a1"/><text x="48" y="61" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">5</text>
      <text x="88" y="59" fill="#fff" font-size="27" font-weight="700">Wheels</text>
      <text x="30" y="110" fill="#dbe7f1" font-size="21">Look for loose or missing hardware.</text>
      <text x="30" y="143" fill="#dbe7f1" font-size="21">Use the maker's torque procedure.</text>
      <text x="30" y="178" fill="#efc760" font-size="18">Never guess a torque value.</text>
    </g>
    <g transform="translate(798 418)">
      <rect width="330" height="202" rx="22" fill="#102b4a" stroke="#315b7e"/>
      <circle cx="48" cy="52" r="25" fill="#16a6a1"/><text x="48" y="61" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">6</text>
      <text x="88" y="59" fill="#fff" font-size="27" font-weight="700">Lights</text>
      <text x="30" y="110" fill="#dbe7f1" font-size="21">Test running, brake and signal lights.</text>
      <text x="30" y="143" fill="#dbe7f1" font-size="21">Check the plug and breakaway system.</text>
      <text x="30" y="178" fill="#efc760" font-size="18">Do not tow with failed lighting.</text>
    </g>
  </g>
  <text x="72" y="692" fill="#ffffff" font-family="Arial, sans-serif" font-size="23" font-weight="700">If one safety-critical check fails, fix it before the trailer moves.</text>
  <text x="72" y="727" fill="#8eacc5" font-family="Arial, sans-serif" font-size="18">Harris Boat Works • Gores Landing, Ontario</text>
</svg>
