<g font-family="Arial,Helvetica,sans-serif" fill="#132b40">
<text x="40" y="104" font-size="40" font-weight="700">Agree on the acceptance checks</text>
<text x="40" y="155" font-size="29">Document the plan for your boat and the work ordered.</text>
<rect x="40" y="195" width="720" height="108" rx="14" fill="white"/>
