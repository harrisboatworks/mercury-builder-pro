<rect x="40" y="445" width="720" height="108" rx="14" fill="white"/>
<text x="62" y="489" font-size="33" font-weight="700">Account for conditions</text>
<text x="62" y="529" font-size="29">Document alternatives when water testing is not safe.</text>
<text x="40" y="620" font-size="28">A process guide, not evidence of a completed customer test.</text>
