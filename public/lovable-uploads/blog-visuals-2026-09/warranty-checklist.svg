<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680" role="img" aria-label="Check your warranty coverage">
<rect width="800" height="680" rx="24" fill="#f5f1e9"/>
<path d="M40 45h64" stroke="#c92332" stroke-width="7"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#132b40">
<text x="40" y="104" font-size="40" font-weight="700">Check your warranty coverage</text>
<text x="40" y="155" font-size="29">Use the written terms for the exact motor and use.</text>
<rect x="40" y="195" width="720" height="108" rx="14" fill="white"/>
<text x="62" y="239" font-size="33" font-weight="700">Confirm eligibility</text>
<text x="62" y="279" font-size="29">Pleasure and commercial use can differ.</text>
<rect x="40" y="320" width="720" height="108" rx="14" fill="white"/>
<text x="62" y="364" font-size="33" font-weight="700">Check coverage and dates</text>
<text x="62" y="404" font-size="29">Separate warranty from optional protection.</text>
<rect x="40" y="445" width="720" height="108" rx="14" fill="white"/>
<text x="62" y="489" font-size="33" font-weight="700">Keep service records</text>
<text x="62" y="529" font-size="29">Follow the applicable maintenance requirements.</text>
<text x="40" y="620" font-size="28">Ask for the current terms before making a decision.</text>
</g></svg>