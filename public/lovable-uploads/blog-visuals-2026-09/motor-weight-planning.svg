<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680" role="img" aria-label="Plan for the installed motor">
<rect width="800" height="680" rx="24" fill="#f5f1e9"/>
<path d="M40 45h64" stroke="#c92332" stroke-width="7"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#132b40">
<text x="40" y="104" font-size="40" font-weight="700">Plan for the installed motor</text>
<text x="40" y="155" font-size="29">A dry-weight figure is only the starting point.</text>
<rect x="40" y="195" width="720" height="108" rx="14" fill="white"/>
<text x="62" y="239" font-size="33" font-weight="700">Identify the exact configuration</text>
<text x="62" y="279" font-size="29">Model, shaft and gearcase all matter.</text>
<rect x="40" y="320" width="720" height="108" rx="14" fill="white"/>
<text x="62" y="364" font-size="33" font-weight="700">Account for the complete installation</text>
<text x="62" y="404" font-size="29">Include fluids, propeller and rigging.</text>
<rect x="40" y="445" width="720" height="108" rx="14" fill="white"/>
<text x="62" y="489" font-size="33" font-weight="700">Confirm what your hull can carry</text>
<text x="62" y="529" font-size="29">Check the boat manufacturer’s limits.</text>
<text x="40" y="620" font-size="28">Have the complete setup checked before ordering.</text>
</g></svg>