<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">Choose horsepower for the boat and its load</title><desc id="desc">Four checks: documented boat limits, actual load and use, the complete engine and rigging setup, and confirmation of fit. Boat length alone does not determine horsepower.</desc><rect width="1000" height="800" rx="28" fill="#f4efe3"/><g font-family="Arial, sans-serif"><text x="60" y="75" font-size="18" letter-spacing="3" fill="#b7192d">MERCURY REPOWER PLANNING</text><text x="60" y="132" font-size="39" font-weight="700" fill="#102a43">Choose for the boat.</text><text x="60" y="180" font-size="39" font-weight="700" fill="#102a43">Check the load and the limits.</text><rect x="60" y="218" width="880" height="98" rx="15" fill="white"/><circle cx="104" cy="266" r="25" fill="#102a43"/><text x="104" y="273" text-anchor="middle" font-size="19" fill="white">01</text><text x="148" y="256" font-size="25" font-weight="700" fill="#102a43">Read the boat limits</text><text x="148" y="289" font-size="22" fill="#334e68">Maximum power, motor weight and load.</text><rect x="60" y="334" width="880" height="98" rx="15" fill="white"/><circle cx="104" cy="382" r="25" fill="#102a43"/><text x="104" y="389" text-anchor="middle" font-size="19" fill="white">02</text><text x="148" y="372" font-size="25" font-weight="700" fill="#102a43">Describe the real load</text><text x="148" y="405" font-size="22" fill="#334e68">People, fuel, gear and planned use.</text><rect x="60" y="450" width="880" height="98" rx="15" fill="white"/><circle cx="104" cy="498" r="25" fill="#102a43"/><text x="104" y="505" text-anchor="middle" font-size="19" fill="white">03</text><text x="148" y="488" font-size="25" font-weight="700" fill="#102a43">Match the complete setup</text><text x="148" y="521" font-size="22" fill="#334e68">Hull, shaft, controls, steering and propeller.</text><rect x="60" y="566" width="880" height="98" rx="15" fill="white"/><circle cx="104" cy="614" r="25" fill="#102a43"/><text x="104" y="621" text-anchor="middle" font-size="19" fill="white">04</text><text x="148" y="604" font-size="25" font-weight="700" fill="#102a43">Confirm the fit</text><text x="148" y="637" font-size="22" fill="#334e68">Use the boat records and dealer assessment.</text><text x="60" y="735" font-size="22" font-weight="700" fill="#b7192d">Length alone does not choose horsepower.</text><text x="60" y="770" font-size="19" fill="#334e68">A bigger motor is not a substitute for a suitable hull and rigging.</text></g></svg>