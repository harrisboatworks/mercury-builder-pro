.iso[data-theme="light"]{--anatomy-blue:#2f7db8;--cf-case:#eaf2f8;--cf-navy:#10293e;--cf-lake:#cfe2f1}

.cf-lake-front{fill:var(--anatomy-blue);opacity:.17}

.cf-line{fill:none;stroke:var(--anatomy-blue);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.cf-dots{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 34}

.cf-svg[data-hl="1"] [data-n]:not([data-n~="1"]),.cf-svg[data-hl="2"] [data-n]:not([data-n~="2"]),.cf-svg[data-hl="3"] [data-n]:not([data-n~="3"]),.cf-svg[data-hl="4"] [data-n]:not([data-n~="4"]),.cf-svg[data-hl="5"] [data-n]:not([data-n~="5"]),.cf-svg[data-hl="6"] [data-n]:not([data-n~="6"]){opacity:.18}

.cf-toggle[aria-pressed="true"]{border-color:var(--anatomy-red);color:var(--anatomy-strong);background:color-mix(in srgb,var(--anatomy-red) 12%,var(--anatomy-card))}
.cf-toggle[aria-pressed="true"] i{background:var(--anatomy-red);border-color:var(--anatomy-red)}
.cf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:12px 0 0;background:var(--anatomy-lo);border:1px solid var(--anatomy-lo)}
.cf-stat{background:var(--anatomy-card);padding:9px 10px 10px;display:grid;gap:5px;min-width:0;align-content:start}
.cf-stat b{font:600 10px/1.1 var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--anatomy-muted)}
.cf-stat span{font:500 15px/1.2 var(--anatomy-mono);font-variant-numeric:tabular-nums;color:var(--anatomy-strong);white-space:nowrap}
.cf-bar{position:relative;height:5px;background:var(--anatomy-faint);border-radius:3px;overflow:hidden}
.cf-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--anatomy-hi);border-radius:3px;transition:background-color .3s}
.cf-stat[data-stat="tell"][data-level="weak"] .cf-bar i{background:var(--anatomy-blue);opacity:.7}
.cf-stat[data-stat="tell"][data-level="none"] .cf-bar i{background:var(--anatomy-red)}
.cf-stat[data-stat="pump"] .cf-bar i{background:var(--anatomy-blue)}
.cf-bar[data-zones]{overflow:visible;background:linear-gradient(90deg,color-mix(in srgb,var(--anatomy-blue) 55%,transparent) 0 30%,color-mix(in srgb,var(--anatomy-green) 55%,transparent) 30% 62%,color-mix(in srgb,var(--anatomy-red) 55%,transparent) 62% 100%)}
.cf-bar[data-zones] i{left:0;width:3px;top:-3px;bottom:-3px;margin-left:-1.5px;border-radius:1px;background:var(--anatomy-strong)}
.cf-stat[data-alarm="on"] span{color:var(--anatomy-red)}
.cf-reading{margin:12px 0 0;display:grid;gap:3px;font:400 13px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--anatomy-text)}
.cf-reading b{font:600 10px/1.1 var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--anatomy-muted)}
.cf-reading span{color:var(--anatomy-strong)}
/* every possible reading sits invisibly in the same cell, so the box is always the height of the longest one */
.cf-read-box{display:grid}
.cf-read-box>span{grid-area:1/1}
.cf-read-box>.cf-ghost{visibility:hidden}
@media (max-width:560px){.iso-plate-corner[data-corner="readout"]{display:none}.cf-stats{grid-template-columns:repeat(2,1fr)}.cf-toggle{flex:1 1 auto;justify-content:flex-start}}

</div><p class="cf-reading" aria-hidden="true"><b>What this tells you</b><span class="cf-read-box"><span data-reading>Strong tell-tale, steady temperature: looks normal. The stream alone does not prove it.</span><span class="cf-ghost">Strong tell-tale, steady temperature: looks normal. The stream alone does not prove it.</span><span class="cf-ghost">Strong tell-tale but overheating: reduce throttle, shut down if the alarm stays on, and have the thermostat checked.</span><span class="cf-ghost">Strong tell-tale and the temperature is coming back down: cooling is recovering. If the alarm stays on, shut down.</span><span class="cf-ghost">Weak tell-tale with a clear intake: suspect the impeller. Shut down and have it checked before the next run.</span><span class="cf-ghost">Weak tell-tale with a clear intake: suspect the impeller. Reduce throttle, shut down if the alarm stays on, and have it checked before the next run.</span><span class="cf-ghost">Weak tell-tale with weeds or a bag over the intake: shut down and clear it.</span><span class="cf-ghost">Weak tell-tale with weeds or a bag over the intake: reduce throttle, shut down if the alarm stays on, and clear the intake.</span><span class="cf-ghost">No stream: shut down now and check the intake and the pump.</span></span></p><span class="cf-sr" role="status" aria-live="polite" data-say></span></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch cf-sw" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13" style="stroke:#eaf2f8;stroke-width:6"/><path d="M1.5 5h13" style="stroke:var(--anatomy-blue);stroke-width:2.6"/></svg>Cooling water, moving</span><span class="iso-key"><svg class="iso-swatch" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13" style="stroke:#eaf2f8;stroke-width:4.2"/><path d="M1.5 5h13" style="stroke:var(--anatomy-blue);stroke-width:1.5"/></svg>Tell-tale tap (before the thermostat)</span><span class="iso-key"><svg class="iso-swatch" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13" style="stroke:var(--anatomy-blue);stroke-width:2.6;opacity:.3"/></svg>Faded: little or no water moving</span><span class="iso-key"><svg class="iso-swatch" viewBox="0 0 16 10" aria-hidden="true"><circle cx="8" cy="5" r="4.2" style="fill:none;stroke:var(--anatomy-hi);stroke-width:1"/></svg>Pump impeller (vanes bend or go missing when worn)</span></span><details class="iso-more"><summary>How this figure works</summary><span class="iso-caption">A Mercury FourStroke outboard (drawn from a 60 hp) in the water, with the cooling circuit drawn over it like an x-ray. The route is simplified: real passages are inside the castings and differ by model. The water takes one path, numbered on the parts: in through the intake slots on the gearcase (1), through the rubber-impeller pump on top of the gearcase (2), up the water tube (3), through the cooling passages in the powerhead (4), past the thermostat (5) and overboard through the prop hub, with the tell-tale stream tapping the circuit on the way (6). The thermostat controls temperature by how much water it lets leave the powerhead. The tell-tale is drawn as a small tap teed off the water tube below the thermostat, so it sees supply water before the thermostat; that is how this figure is drawn, not a claim about every model. Pump flow rises with rpm. Intake blocked (weeds, a plastic bag, zebra mussels; the most common cause we see on Rice Lake and the Kawarthas): flow stays low at every rpm, the tell-tale is weak, and the temperature climbs until the alarm. Worn impeller (worn, hardened or missing vanes): the pump moves less water at every rpm, roughly half of a healthy one, so the tell-tale is weak and the temperature climbs. Thermostat stuck closed: the pump keeps pushing, but with the main exit shut the water mostly escapes through the tell-tale and small bypass passages, so the tell-tale stays strong while too little moves through the hot powerhead and the alarm sounds. A tell-tale stream alone does not prove the engine is cooling correctly. Weak or stopped flow is a shutdown signal: stop the engine and follow the owner's manual. Time is sped up here, so the temperature moves far faster than in a real engine; nothing in this figure tells you how long you have. All values are illustrative and relative: flow is a share of what a healthy pump gives at that rpm, and the gauge has no scale.</span></details></figcaption></figure></main><script type="module">
// Pure cooling model for the figure. Everything shown (flow, tell-tale, temperature, alarm, the one-line reading)
// comes from here. Numbers are RELATIVE and illustrative: no litres, degrees or psi anywhere.
// It runs at build time (first frame) and inline in the page.
const clampM = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sstep = (a, b, x) => {
  const t = clampM((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};

const MODEL = {
  idleRpm: 0.14, // relative rpm at the lever's idle stop, 1 = top of the lever
  alarmOn: 0.82, // gauge fractions (needle position); the arcs on the dial are cold / normal / hot
  alarmOff: 0.76,
  arcs: { cold: [0, 0.3], normal: [0.3, 0.62], hot: [0.62, 1] },
  rising: 0.62,
  margin: 1.35, // a healthy pump carries away 1.35x the heat the engine makes at every rpm
  tapShare: 0.28, // share of pump flow that goes up the tell-tale branch (tapped BEFORE the thermostat)
  tauUp: 2.6,
  tauDown: 3.0,
};

const rpmOf = (throttle) => MODEL.idleRpm + (1 - MODEL.idleRpm) * clampM(throttle, 0, 1);
const engineWord = (throttle) => (throttle < 0.08 ? "Idle" : throttle < 0.5 ? "Throttling up" : "Cruise");

// How well each fault lets the pump deliver, as a fraction of "healthy at this rpm".
// time is the model clock in seconds; the worn impeller's contact at idle comes and goes.
function pumpFraction(faults, rpm, time) {
  let f = 1;
  if (faults.blocked) f *= 0.4; // a fixed restriction: the pump gets the same share of a healthy flow at every rpm
  if (faults.worn) {
    // worn, hardened or missing vanes: less water at every rpm (HBW's posts disagree on idle vs speed, so no signature is modelled)
    f *= 0.57 - 0.12 * sstep(0.1, 1, rpm) + 0.015 * Math.sin(time * 0.9);
  }
  return clampM(f, 0, 1);
}

function snapshot(faults, throttle, time, temp) {
  const rpm = rpmOf(throttle);
  const pct = pumpFraction(faults, rpm, time);
  const stuck = faults.stuck ? 1 : 0;
  const exit = pct * (stuck ? 0.14 : 1); // what actually leaves the powerhead (relative to healthy)
  const rho = MODEL.margin * pct * (stuck ? 0.2 : 1);
  const target = 0.46 + 0.08 * rpm + 0.55 * clampM((MODEL.margin - rho) / 0.85, 0, 1.3) * (rho < MODEL.margin ? 1 : 0);
  return { rpm, pct, exit, target, strength: pct * (0.6 + 0.4 * rpm), temp };
}

const tellWord = (pct) => (pct >= 0.8 ? "Strong" : pct >= 0.2 ? "Weak" : "None");
const tempWord = (temp, alarm) => (alarm ? "Overheat" : temp >= MODEL.rising ? "Rising" : "Normal");

// the eased temperature and the alarm latch; returns the new { temp, alarm }
function stepTemp(state, target, dt) {
  const tau = target > state.temp ? MODEL.tauUp : MODEL.tauDown;
  const temp = state.temp + (target - state.temp) * (1 - Math.exp(-dt / tau));
  let alarm = state.alarm;
  if (!alarm && temp > MODEL.alarmOn) alarm = true;
  else if (alarm && temp < MODEL.alarmOff) alarm = false;
  return { temp: clampM(temp, 0, 1), alarm };
}

// the thermostat poppet: stuck closed means it never lifts
const thermoLift = (faults, temp) => (faults.stuck ? 0 : clampM(0.15 + (temp - 0.36) * 4, 0.15, 1));

// the one-line reading. It uses what a person could see: the tell-tale, the alarm, the trend, and whether the intake is
// plainly choked with weeds or a bag. Every overheat line carries the response, and none tells anyone to run or idle the motor to test.
function reading(faults, throttle, time, temp, alarm, trend = 0) {
  const here = pumpFraction(faults, rpmOf(throttle), time);
  const tell = tellWord(here);
  const hot = alarm || temp >= MODEL.rising;
  const act = "reduce throttle, shut down if the alarm stays on, and have it checked";
  if (tell === "None") return "No stream: shut down now and check the intake and the pump.";
  if (tell === "Strong" && !hot) return "Strong tell-tale, steady temperature: looks normal. The stream alone does not prove it.";
  if (tell === "Strong" && trend < -0.012) return "Strong tell-tale and the temperature is coming back down: cooling is recovering. If the alarm stays on, shut down.";
  if (tell === "Strong") return "Strong tell-tale but overheating: reduce throttle, shut down if the alarm stays on, and have the thermostat checked.";
  if (faults.blocked) return hot ? "Weak tell-tale with weeds or a bag over the intake: reduce throttle, shut down if the alarm stays on, and clear the intake." : "Weak tell-tale with weeds or a bag over the intake: shut down and clear it.";
  return hot ? `Weak tell-tale with a clear intake: suspect the impeller. ${act[0].toUpperCase()}${act.slice(1)} before the next run.` : "Weak tell-tale with a clear intake: suspect the impeller. Shut down and have it checked before the next run.";
}

const CFG = {"LEVER":{"px":34,"py":128,"len":96,"from":-6,"span":74},"GAUGE":{"cx":75,"cy":70,"r":50,"from":-130,"span":260},"NOZ":[516,345],"WATER":745,"HUB":[452,955],"alarmAt":[300,175],"vanes":8};
const vanePath = (i, k, bend = 0, n = 8) => {
  // one curved rubber vane of the impeller inset (from the video), k = length factor, bend = extra sweep in degrees
  const th = (i * 360) / n;
  const rh = 36;
  const R = rh + (92 - rh) * k;
  const d = R - rh;
  const P = (r, a) => {
    const t = ((a - 90) * Math.PI) / 180;
    return `${(100 + r * Math.cos(t)).toFixed(1)} ${(100 + r * Math.sin(t)).toFixed(1)}`;
  };
  return `M ${P(rh, th - 10)} C ${P(rh + 0.35 * d, th - 6)} ${P(rh + 0.75 * d, th + 10 + bend * 0.5)} ${P(R, th + 34 + bend)} C ${P(rh + 0.8 * d, th + 28 + bend)} ${P(rh + 0.45 * d, th + 14)} ${P(rh, th + 10)} Z`;
};
// Live behaviour for the v2 cooling figure. model.mjs, CFG and vanePath are inlined above this.
const stage = document.querySelector(".cf-stage");
const root = stage.closest(".iso-figure");
const svg = stage.querySelector("svg");
const lever = document.querySelector(".cf-throttle");
const leverSvg = lever.querySelector("svg");
const corner = document.querySelector("[data-readout]");
const sayEl = document.querySelector("[data-say]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const q = (selector, el = svg) => el.querySelector(selector);
const tiles = {};
for (const el of document.querySelectorAll("[data-stat]")) tiles[el.dataset.stat] = { box: el, value: el.querySelector("[data-v]"), bar: el.querySelector("[data-bar]") };
const readingEl = document.querySelector("[data-reading]");
const buttons = [...document.querySelectorAll("button[data-fault]")];

const LEGS = ["S", "A", "B", "C", "D", "T0"]; // S = the supply line itself; A, B, C carry its moving dots
const legs = {};
for (const k of LEGS) legs[k] = { line: q(`[data-line="${k}"]`), cas: q(`[data-case="${k}"]`), dots: q(`[data-dots="${k}"]`), travel: 0, key: "", period: 34 };
const els = {
  arc: q("[data-arc]"),
  arcCase: q("[data-arc-case]"),
  arcDots: q('[data-dots="arc"]'),
  splash: q("[data-splash]"),
  bubbles: [...svg.querySelectorAll("[data-bubble]")],
  weeds: q("[data-weeds]"),
  strands: q("[data-strands]"),
  pumpWheel: q("[data-pump-wheel]"),
  poppet: q("[data-poppet]"),
  thermo: q(".cf-thermo"),
  thFill: q("[data-thfill]"),
  lock: q("[data-lock]"),
  alarm: q("[data-alarm]"),
  insets: [...root.querySelectorAll(".cf-inset")],
  wheels: [...root.querySelectorAll("[data-wheel]")],
  vanes: [...root.querySelectorAll("[data-vane]")],
  insetLabels: [...root.querySelectorAll("[data-inset-label]")],
  lever: q("[data-lever]", leverSvg),
  needle: document.querySelector(".cf-gauge [data-needle]"),
  lamp: document.querySelector(".cf-gauge [data-lamp]"),
};
const { LEVER, GAUGE, NOZ, WATER, HUB } = CFG;

const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const follow = (value, target, dt, tau) => value + (target - value) * (1 - Math.exp(-dt / tau));
const sstep3 = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const f1 = (v) => v.toFixed(1);
const NAMES = { blocked: "Intake blocked", worn: "Worn impeller", stuck: "Thermostat stuck" };

// ---- state (as v1)
const faults = { blocked: false, worn: false, stuck: false };
let throttle = 0;
let tTarget = 0;
let wear = 0;
let weed = 0;
let clock = 0;
let slow = 1;
let slowTarget = 1;
let phase = 0.3;
let temp = 0.5;
let alarm = false;
let lift = 0.5;
let bubbleClock = 0;
let trend = 0;
let raw = { pct: 1, strength: 1 };
const shown = { pct: 1, exit: 1, strength: 1 };
{
  const first = snapshot(faults, 0, 0, 0.5);
  temp = clamp(first.target, 0, 1);
  lift = thermoLift(faults, temp);
}
let touring = false;
let tourClock = 0;
let tourPhase = -1;
let dragging = false;
let frame = 0;
let last = 0;
let visible = false;
let idleTimer = 0;
let startTimer = 0;
let sayTimer = 0;
let sayPrefix = "";
let lastAlarmSay = -99;
let lastAlarm = false;
let lastTile = "";
let lastReading = "";
let lastArc = "";
let lastWear = -1;

// ---- announcements (aria-live): user actions only, after the numbers have settled
function say(message) {
  sayEl.textContent = "";
  setTimeout(() => (sayEl.textContent = message), 30);
}
function summary() {
  const here = pumpFraction(faults, rpmOf(tTarget), clock);
  return `${engineWord(tTarget)}. Pump flow ${Math.round(here * 100)} percent of healthy. Tell-tale ${tellWord(here).toLowerCase()}. Temperature ${tempWord(temp, alarm).toLowerCase()}. ${reading(faults, tTarget, clock, temp, alarm, trend)}`;
}
function announce(prefix) {
  sayPrefix = prefix;
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => say(`${sayPrefix} ${summary()}`), 1300);
}
function syncButtons() {
  for (const b of buttons) b.setAttribute("aria-pressed", faults[b.dataset.fault] ? "true" : "false");
}

// ---- drawing
// how a leg looks for a given amount of water (0..1 of healthy): the line thins and dims, the dots thin out and fade,
// down to a floor that keeps the route traceable. The tap is drawn at about 60% of the main line's width.
const BASE_W = { S: 14, D: 14, T0: 8.4 };
const dotSpeed = (q) => 60 + 300 * q; // drawing units per second
function setLeg(k, amount, flow, dt) {
  const L = legs[k];
  const a = clamp(amount, 0, 1);
  const key = String(Math.round(a * 100));
  if (key !== L.key) {
    L.key = key;
    if (L.line) {
      L.line.style.opacity = (0.35 + 0.65 * a).toFixed(2);
      L.line.style.strokeWidth = f1(BASE_W[k] * (0.45 + 0.55 * a));
      L.cas.style.opacity = (0.94 * (0.35 + 0.65 * sstep3(0.05, 0.7, a))).toFixed(2);
    }
    L.period = 34 / Math.max(0.25, a);
    if (L.dots) L.dots.style.strokeDasharray = `0.1 ${f1(L.period)}`;
  }
  if (!L.dots) return;
  L.travel = (L.travel + (still.matches ? 0 : dotSpeed(flow) * dt * slow)) % L.period;
  L.dots.style.strokeDashoffset = f1(-L.travel);
  L.dots.style.opacity = sstep3(0.08, 0.4, a).toFixed(2);
}

// the tell-tale stream: a free fall from the outlet to the lake; reach, rise and width scale with strength
let arcTravel = 0;
function tellArc(dt) {
  const k = sstep3(0.35, 0.9, shown.strength);
  const on = sstep3(0.19, 0.24, shown.pct); // nothing when the tell-tale reads None
  const R = 14 + 160 * k;
  const h = 70 * k;
  const fall = WATER - NOZ[1];
  const a = -2 * h - Math.sqrt(4 * h * h + 4 * fall * h);
  const b = fall - a;
  const pts = [];
  for (let i = 0; i <= 18; i++) {
    const u = i / 18;
    pts.push(`${f1(NOZ[0] + R * u)} ${f1(NOZ[1] + a * u + b * u * u)}`);
  }
  const d = `M${pts.join("L")}`;
  if (d !== lastArc) {
    lastArc = d;
    els.arc.setAttribute("d", d);
    els.arcCase.setAttribute("d", d);
    els.arcDots.setAttribute("d", d);
  }
  const w = 4 + 8 * k;
  els.arc.style.strokeWidth = f1(w);
  els.arcCase.style.strokeWidth = f1(w + 6);
  els.arc.style.opacity = (on * (0.6 + 0.4 * k)).toFixed(2);
  els.arcCase.style.opacity = (0.85 * on).toFixed(2);
  arcTravel = (arcTravel + (still.matches ? 0 : dotSpeed(shown.strength) * dt * slow)) % 34;
  els.arcDots.style.strokeDashoffset = f1(-arcTravel);
  els.arcDots.style.opacity = (on * sstep3(0.25, 0.7, shown.strength)).toFixed(2);
  const pulse = still.matches ? 1 : 0.75 + 0.25 * Math.sin(clock * 9);
  const rx = 8 + 22 * k;
  els.splash.setAttribute("cx", f1(NOZ[0] + R));
  els.splash.setAttribute("rx", f1(rx));
  els.splash.setAttribute("ry", f1(rx * 0.3));
  els.splash.style.opacity = (0.7 * on * pulse).toFixed(2);
}

function bubbles(plume, dt) {
  const live = clamp(plume * 1.25, 0, 1);
  const n = els.bubbles.length;
  bubbleClock = (bubbleClock + (still.matches ? 0 : (0.12 + 0.5 * plume) * dt * slow)) % 1;
  els.bubbles.forEach((el, i) => {
    const rnd = (m) => ((Math.sin((i + 1) * 12.9898 + m * 78.233) * 43758.5453) % 1 + 1) % 1;
    const on = i < Math.ceil(n * live) && plume > 0.02;
    const u = still.matches ? (i + 0.5) / n : (bubbleClock + i / n) % 1;
    const x = HUB[0] + 8 + 110 * u ** 1.1 + Math.sin(u * 9 + rnd(2) * 6) * 8 * (0.3 + u) + rnd(3) * 10;
    const y = HUB[1] + (rnd(1) - 0.5) * 18 - (HUB[1] - WATER - 12) * u ** 0.9;
    const fade = Math.min(1, u * 8) * Math.min(1, (1 - u) * 6);
    el.setAttribute("cx", f1(x));
    el.setAttribute("cy", f1(y));
    el.setAttribute("r", f1((5 + 6 * rnd(5) + 5 * u) * (0.6 + 0.5 * live)));
    el.style.opacity = on ? (0.95 * fade).toFixed(2) : "0";
  });
}

// worn: three vanes torn short, two bent back, the rest a little shorter
const MISSING = [1, 4, 6];
const BENT = [0, 3];
function vanes() {
  if (Math.abs(wear - lastWear) < 1e-3) return;
  lastWear = wear;
  els.vanes.forEach((el, j) => {
    const i = Number(el.dataset.vane);
    let k = 1 - 0.08 * wear;
    let bend = 0;
    if (MISSING.includes(i)) k = 1 - 0.72 * wear;
    else if (BENT.includes(i)) {
      k = 1 - 0.22 * wear;
      bend = -46 * wear;
    }
    el.setAttribute("d", vanePath(i % CFG.vanes, k, bend));
  });
  for (const el of els.insets) {
    if (wear > 0.5) el.setAttribute("data-worn", "");
    else el.removeAttribute("data-worn");
  }
  for (const el of els.insetLabels) {
    const side = el.tagName !== "text";
    el.textContent = wear > 0.5 ? (side ? "Worn vanes" : "WORN VANES") : side ? "Pump impeller" : "IMPELLER";
  }
}

function draw(dt) {
  const rpm = rpmOf(throttle);
  const sp = 0.18 + 0.82 * rpm;
  const pct = shown.pct;
  const exit = shown.exit;
  // supply legs carry pct; the return to overboard carries exit
  setLeg("S", pct, 0, dt);
  setLeg("A", pct, pct * sp, dt);
  setLeg("B", pct, pct * sp, dt);
  setLeg("C", pct, pct * sp * (0.35 + 0.65 * (pct > 0.001 ? Math.min(1, exit / pct) : 0)), dt);
  setLeg("T0", pct, pct * sp, dt);
  setLeg("D", exit, exit * sp, dt);
  tellArc(dt);
  bubbles(Math.min(1, exit * sp * 1.5), dt);
  // moving parts
  const deg = ((phase * 180) / Math.PI) % 360;
  for (const w of els.wheels) w.setAttribute("transform", `rotate(${f1(deg)} 100 100)`);
  els.pumpWheel.setAttribute("transform", `translate(${els.pumpWheel.dataset.x} ${els.pumpWheel.dataset.y}) rotate(${f1(deg)})`);
  vanes();
  // thermostat: the poppet lifts off its seat; stuck = seated and locked
  // the valve across the outlet turns from closed (across the flow) to open (along it)
  els.poppet.setAttribute("transform", `rotate(${f1(90 * lift)} ${els.poppet.dataset.cx} ${els.poppet.dataset.cy})`);
  els.lock.style.opacity = faults.stuck ? "1" : "0";
  els.thFill.setAttribute("y2", f1(17.6 - 2 - 9.5 * clamp((temp - 0.25) / 0.75, 0, 1)));
  if (temp >= MODEL.rising || alarm) els.thermo.setAttribute("data-hot", "");
  else els.thermo.removeAttribute("data-hot");
  // alarm pulse on the powerhead
  els.alarm.style.opacity = alarm ? (still.matches ? 0.75 : 0.5 + 0.35 * Math.sin(clock * 7)).toFixed(2) : "0";
  // weeds over the intake
  els.weeds.style.opacity = weed.toFixed(2);
  els.strands.setAttribute("transform", `translate(${(still.matches ? 0 : 4 * Math.sin(clock * 1.7)).toFixed(1)} 0)`);
  // instruments
  els.lever.setAttribute("transform", `rotate(${f1(LEVER.from + LEVER.span * throttle)} ${LEVER.px} ${LEVER.py})`);
  els.needle.setAttribute("transform", `rotate(${f1(GAUGE.from + GAUGE.span * clamp(temp, 0, 1))} ${GAUGE.cx} ${GAUGE.cy})`);
  if (alarm) els.lamp.setAttribute("data-on", "");
  else els.lamp.removeAttribute("data-on");
  readouts(raw);
}
{
  const v = els.poppet.getAttribute("transform").match(/rotate\(([-\d.]+) ([-\d.]+) ([-\d.]+)\)/);
  els.poppet.dataset.cx = v[2];
  els.poppet.dataset.cy = v[3];
  const t = els.pumpWheel.getAttribute("transform").match(/translate\(([-\d.]+) ([-\d.]+)\)/);
  els.pumpWheel.dataset.x = t[1];
  els.pumpWheel.dataset.y = t[2];
}

function readouts(snap) {
  const engine = engineWord(throttle);
  const pct = Math.round(snap.pct * 100);
  const tell = tellWord(snap.pct);
  const word = tempWord(temp, alarm);
  const key = `${engine}|${Math.round(rpmOf(throttle) * 50)}|${pct}|${tell}|${word}|${Math.round(temp * 50)}|${Math.round(snap.strength * 50)}|${slowTarget}`;
  if (key !== lastTile) {
    lastTile = key;
    tiles.engine.value.textContent = engine;
    tiles.engine.bar.style.width = `${(rpmOf(throttle) * 100).toFixed(0)}%`;
    tiles.pump.value.textContent = `${pct}%`;
    tiles.pump.bar.style.width = `${pct}%`;
    tiles.tell.value.textContent = tell;
    tiles.tell.bar.style.width = `${(clamp(snap.strength, 0, 1) * 100).toFixed(0)}%`;
    tiles.temp.value.textContent = word;
    tiles.temp.bar.style.left = `${(temp * 100).toFixed(1)}%`;
    tiles.temp.box.dataset.alarm = alarm ? "on" : "off";
    tiles.tell.box.dataset.level = tell.toLowerCase();
    corner.textContent = `${engine} · flow ${pct}% · ${tell.toLowerCase()}${slowTarget < 1 ? " · slow" : ""}`;
  }
  const line = reading(faults, throttle, clock, temp, alarm, trend);
  if (line !== lastReading) {
    lastReading = line;
    readingEl.textContent = line;
  }
}

// ---- idle tour (as v1): healthy, blocked intake, worn impeller, stuck thermostat; the throttle sweeps up and back in each
const TOUR_LEN = 13.5;
const TOUR_SETS = [{}, { blocked: true }, { worn: true }, { stuck: true }];
const tourThrottle = (m) => sstep3(2.6, 5.6, m) - sstep3(8.8, 11.8, m);
function applyTour() {
  const index = Math.floor(tourClock / TOUR_LEN) % TOUR_SETS.length;
  if (index !== tourPhase) {
    tourPhase = index;
    for (const name of Object.keys(faults)) faults[name] = !!TOUR_SETS[index][name];
    temp = 0.5;
    alarm = false;
    lastAlarm = false;
    trend = 0;
    lift = thermoLift(faults, temp);
    syncButtons();
  }
  tTarget = tourThrottle(tourClock % TOUR_LEN);
  syncThrottleAria();
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) {
    tourClock += dt;
    applyTour();
  }
  if (!calm) clock += dt;
  const wearT = faults.worn ? 1 : 0;
  const weedT = faults.blocked ? 1 : 0;
  if (calm) {
    throttle = tTarget;
    wear = wearT;
    weed = weedT;
    slow = slowTarget;
  } else {
    throttle = follow(throttle, tTarget, dt, 0.22);
    wear = follow(wear, wearT, dt, 0.4);
    weed = follow(weed, weedT, dt, 0.5);
    slow = follow(slow, slowTarget, dt, 0.25);
  }
  if (Math.abs(throttle - tTarget) < 1e-4) throttle = tTarget;
  if (Math.abs(wear - wearT) < 1e-3) wear = wearT;
  if (Math.abs(weed - weedT) < 1e-3) weed = weedT;
  const rpm = rpmOf(throttle);
  const snap = snapshot(faults, throttle, clock, temp);
  if (calm) {
    shown.pct = snap.pct;
    shown.exit = snap.exit;
    shown.strength = snap.strength;
  } else {
    shown.pct = follow(shown.pct, snap.pct, dt, 0.25);
    shown.exit = follow(shown.exit, snap.exit, dt, 0.25);
    shown.strength = follow(shown.strength, snap.strength, dt, 0.25);
  }
  raw = snap;
  const state = stepTemp({ temp, alarm }, snap.target, calm ? 100 : dt);
  trend = calm ? 0 : follow(trend, (state.temp - temp) / dt, dt, 0.8);
  temp = state.temp;
  alarm = state.alarm;
  if (alarm !== lastAlarm) {
    lastAlarm = alarm;
    if (!touring && clock - lastAlarmSay > 8) {
      lastAlarmSay = clock;
      say(alarm ? "Overheat alarm on." : "Overheat alarm off.");
    }
  }
  lift = calm ? thermoLift(faults, temp) : follow(lift, thermoLift(faults, temp), dt, 0.4);
  if (!calm) phase += (1.4 + 7.5 * rpm) * dt * slow;
  draw(calm ? 0 : dt);
  const settled = calm && !dragging;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

// ---- interaction (as v1)
const anyFault = () => faults.blocked || faults.worn || faults.stuck;
function resumeLater() {
  clearTimeout(idleTimer);
  clearTimeout(startTimer);
  idleTimer = setTimeout(() => {
    if (still.matches || dragging) return;
    touring = true;
    tourClock = 0;
    tourPhase = -1;
    run();
  }, anyFault() ? 14000 : 3600);
}
function interact() {
  touring = false;
  resumeLater();
}
// Keep the slider's announced value in step with the lever, whether the
// user or the idle tour moved it. Only touch the DOM when the value changes.
let ariaShown = "";
function syncThrottleAria() {
  const now = String(Math.round(tTarget * 100));
  if (now === ariaShown) return;
  ariaShown = now;
  lever.setAttribute("aria-valuenow", now);
  lever.setAttribute("aria-valuetext", engineWord(tTarget));
}
function steer(share, quiet) {
  interact();
  tTarget = clamp(share, 0, 1);
  syncThrottleAria();
  if (!quiet) announce("Throttle changed.");
  run();
}
function toggle(name) {
  interact();
  faults[name] = !faults[name];
  syncButtons();
  announce(`${NAMES[name]} ${faults[name] ? "on" : "off"}.`);
  resumeLater();
  run();
}

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

for (const b of buttons) b.addEventListener("click", () => toggle(b.dataset.fault));

// ---- the numbered legend: hover, focus or tap an item to light that part up; a tap or click pins it, Escape clears it
const legsEls = [...document.querySelectorAll(".cf-leg")];
let pinned = "";
const mainEl = document.querySelector(".cf-main");
const light = (n) => {
  for (const el of [svg, mainEl]) {
    if (n) el.dataset.hl = n;
    else delete el.dataset.hl;
  }
};
const syncLegs = () => legsEls.forEach((b) => b.setAttribute("aria-pressed", b.dataset.hl === pinned ? "true" : "false"));
for (const b of legsEls) {
  b.addEventListener("pointerenter", (event) => {
    if (event.pointerType === "mouse") light(b.dataset.hl);
  });
  b.addEventListener("pointerleave", (event) => {
    if (event.pointerType === "mouse") light(pinned);
  });
  b.addEventListener("focus", () => light(b.dataset.hl));
  b.addEventListener("blur", () => light(pinned));
  b.addEventListener("click", () => {
    pinned = pinned === b.dataset.hl ? "" : b.dataset.hl;
    syncLegs();
    light(pinned);
    interact();
  });
}
root.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && pinned) {
    pinned = "";
    syncLegs();
    light("");
  }
});
root.addEventListener("focusin", () => {
  if (touring) interact();
});

// ---- the lever: drag by angle around its pivot
const shareAt = (event) => {
  const box = leverSvg.getBoundingClientRect();
  const vb = leverSvg.viewBox.baseVal;
  const x = ((event.clientX - box.left) / box.width) * vb.width;
  const y = ((event.clientY - box.top) / box.height) * vb.height;
  const deg = (Math.atan2(x - LEVER.px, LEVER.py - y) * 180) / Math.PI;
  return (deg - LEVER.from) / LEVER.span;
};
lever.addEventListener("pointerdown", (event) => {
  dragging = true;
  lever.dataset.drag = "";
  lever.setPointerCapture(event.pointerId);
  lever.focus({ preventScroll: true });
  steer(shareAt(event), true);
  event.preventDefault();
});
lever.addEventListener("pointermove", (event) => {
  if (dragging) steer(shareAt(event), true);
});
const release = (event) => {
  if (!dragging) return;
  dragging = false;
  delete lever.dataset.drag;
  try {
    lever.releasePointerCapture(event.pointerId);
  } catch (error) {}
  announce("Throttle changed.");
  resumeLater();
  run();
};
lever.addEventListener("pointerup", release);
lever.addEventListener("pointercancel", release);

// ---- keys: arrows, Home/End, PageUp/PageDown on the lever; 1 2 3 and S anywhere in the card
root.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const key = event.key;
  const onLever = event.target === lever;
  const step = event.shiftKey ? 0.25 : 0.1;
  if (onLever && (key === "ArrowUp" || key === "ArrowRight")) steer(tTarget + step);
  else if (onLever && (key === "ArrowDown" || key === "ArrowLeft")) steer(tTarget - step);
  else if (onLever && key === "PageUp") steer(tTarget + 0.25);
  else if (onLever && key === "PageDown") steer(tTarget - 0.25);
  else if (onLever && key === "Home") steer(0);
  else if (onLever && key === "End") steer(1);
  else if (key === "1") toggle("blocked");
  else if (key === "2") toggle("worn");
  else if (key === "3") toggle("stuck");
  else if (key === "s" || key === "S") {
    interact();
    slowTarget = slowTarget === 1 ? 0.18 : 1;
    lastTile = "";
    say(slowTarget === 1 ? "Normal speed." : "Slow motion.");
    run();
  } else return;
  event.preventDefault();
});

draw(0);
if (!still.matches) {
  startTimer = setTimeout(() => {
    touring = true;
    tourClock = 0;
    tourPhase = -1;
    run();
  }, 1400);
}
// reduced motion can be switched on or off while the page is open
still.addEventListener?.("change", () => {
  if (still.matches) {
    touring = false;
    clearTimeout(idleTimer);
    clearTimeout(startTimer);
  }
  run();
});

</script></body></html>
