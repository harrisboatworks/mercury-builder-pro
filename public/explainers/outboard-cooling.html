</div><p class="cf-reading" aria-hidden="true"><b>What this tells you</b><span data-reading>Strong tell-tale, steady temperature: looks normal. The stream alone does not prove it.</span></p><span class="cf-sr" role="status" aria-live="polite" data-say></span></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Rubber impeller (darker when worn)</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Cooling water, moving</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Tell-tale branch (drawn before the thermostat)</span></span><details class="iso-more"><summary>How this figure works</summary><span class="iso-caption">A shop test tank with a mid-range four-stroke outboard, cut open along its middle; the shape is generic, not one model. The water takes one path, numbered on the parts: in through the intake slots on the gearcase (1), through the rubber-impeller pump on the driveshaft (2), up the water tube (3), through the cooling passages in the powerhead (4), past the thermostat (5) and overboard, with the tell-tale stream tapping the circuit on the way (6). The thermostat controls temperature by how much water it lets leave the powerhead. The tell-tale is drawn tapping the circuit before the thermostat; that is how this figure is drawn, not a claim about every model. Pump flow rises with rpm. Intake blocked (weeds, a plastic bag, zebra mussels; the most common on-water cause on Rice Lake and the Kawarthas): flow stays low at every rpm and is worst at idle, the tell-tale is weak, and the temperature climbs until the alarm. Worn impeller (worn, hardened or missing vanes): the pump moves less water at every rpm, roughly half of a healthy one, so the tell-tale is weak and the temperature climbs. Thermostat stuck closed: the alarm sounds while the tell-tale stays strong. A tell-tale stream alone does not prove the engine is cooling correctly. Weak or stopped flow is a shutdown signal: stop the engine and follow the owner's manual. Time is sped up here, so the temperature moves far faster than in a real engine; nothing in this figure tells you how long you have. All values are illustrative and relative: flow is a share of what a healthy pump gives at that rpm, and the gauge has no scale.</span></details></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

};
function pathOf(points, closed = false) {
    if (!points.length)

    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");

const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {

    for (const [cx, cy, start] of corners) {

function signedArea(points) {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

        const index = (start + step) % count;

            run.push((index + 1) % count);

function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;

    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);

        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    const outline = [];
    const crease = [];

    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])

        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;
            return [x - (mx / length) * by, y - (my / length) * by];
        });
        const insetTop = inset.map(([x, y]) => iso([x, y, z + height], projection));
        bevel = runsOf(facing, true)
            .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((index) => insetTop[index]), top[run[run.length - 1]]]))
            .join("");
    }
    return {
        fill,
        outline: outline.join(""),
        crease: crease.join(""),
        top: pathOf(oriented(top), true),
        shades: buckets.map((paths) => paths.join("")),
        bevel,
    };
}
const ringOf = (plan, steps = 8) => roundedPlan(plan, steps);
function slabOf(plan, z, height, projection, steps = 8, bevel = 0) {
    return extrude(ringOf(plan, steps), z, height, projection, { convex: true, bevel });
}
function circleRing(cx, cy, radius, steps = 40) {
    return Array.from({ length: steps }, (_, step) => {

  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));

  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];

      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;

    for (const entry of above) {
      if (entry.used) continue;

      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;

    const ds = meridian[i + 1][0] - meridian[i][0];

      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);

  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;

  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));

    let sweep = wrap(to - from);

    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));

    }

  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);

  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));

    seen.push(row);
    tones.push(toneRow);

  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));

      const b = run.map((j) => rings[i + 1][j]).reverse();

      all.push(d);

    const dr = meridian[i + 1][1] - meridian[i][1];

    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;

    const hi = Math.min(...ranges.map(([, x]) => x));

    const far = Math.acos(Math.max(-1, lo));

    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));

  };

  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;

  let bevelPath = "";

    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);

  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;

    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";

    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";

        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {

  const L = lightOf(P);

  const high = ring.map((point) => iso(at(s1, point), P));

  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];

    const visible = dot3(normal, V) > 1e-6;

  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));

    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];

function stadium(r0, r1, offset, steps = 32) {

function sphereOf(centre, r, P, { steps = 48 } = {}) {

    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));

  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],

const CONSOLE = { x0: 112, x1: 172, y0: 28, y1: 44, z1: 44, pivotX: 142, pivotZ: 14 };
const LEVER = { length: 21, from: 52, span: 104 };
const QUAD_R = 27;

// Pure cooling model for the figure. Everything shown (flow, tell-tale, temperature, alarm, the one-line reading)
// comes from here. Numbers are RELATIVE and illustrative: no litres, degrees or psi anywhere.
// It runs at build time (first frame) and inline in the page.
const clampM = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sstep = (a, b, x) => {
  const t = clampM((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};

const MODEL = {
  idleRpm: 0.14, // relative rpm at the lever's idle stop, 1 = top of the lever
  alarmOn: 0.82, // gauge fractions (needle position); the arcs on the dial are cold / normal / hot
  alarmOff: 0.76,
  arcs: { cold: [0, 0.3], normal: [0.3, 0.62], hot: [0.62, 1] },
  rising: 0.62,
  margin: 1.35, // a healthy pump carries away 1.35x the heat the engine makes at every rpm
  tapShare: 0.28, // share of pump flow that goes up the tell-tale branch (tapped BEFORE the thermostat)
  tauUp: 2.6,
  tauDown: 3.0,
};

const rpmOf = (throttle) => MODEL.idleRpm + (1 - MODEL.idleRpm) * clampM(throttle, 0, 1);
const engineWord = (throttle) => (throttle < 0.08 ? "Idle" : throttle < 0.5 ? "Throttling up" : "Cruise");

// How well each fault lets the pump deliver, as a fraction of "healthy at this rpm".
// time is the model clock in seconds; the worn impeller's contact at idle comes and goes.
function pumpFraction(faults, rpm, time) {
  let f = 1;
  if (faults.blocked) f *= 0.3 + 0.22 * sstep(0, 1, rpm); // restricts at every rpm, worst at idle
  if (faults.worn) {
    // worn, hardened or missing vanes: less water at every rpm (HBW's posts disagree on idle vs speed, so no signature is modelled)
    f *= 0.57 - 0.12 * sstep(0.1, 1, rpm) + 0.015 * Math.sin(time * 0.9);
  }
  return clampM(f, 0, 1);
}

function snapshot(faults, throttle, time, temp) {
  const rpm = rpmOf(throttle);
  const pct = pumpFraction(faults, rpm, time);
  const stuck = faults.stuck ? 1 : 0;
  const exit = pct * (stuck ? 0.14 : 1); // what actually leaves the powerhead (relative to healthy)
  const rho = MODEL.margin * pct * (stuck ? 0.2 : 1);
  const target = 0.46 + 0.08 * rpm + 0.55 * clampM((MODEL.margin - rho) / 0.85, 0, 1.3) * (rho < MODEL.margin ? 1 : 0);
  return { rpm, pct, exit, target, strength: pct * (0.6 + 0.4 * rpm), temp };
}

const tellWord = (pct) => (pct >= 0.8 ? "Strong" : pct >= 0.2 ? "Weak" : "None");
const tempWord = (temp, alarm) => (alarm ? "Overheat" : temp >= MODEL.rising ? "Rising" : "Normal");

// the eased temperature and the alarm latch; returns the new { temp, alarm }
function stepTemp(state, target, dt) {
  const tau = target > state.temp ? MODEL.tauUp : MODEL.tauDown;
  const temp = state.temp + (target - state.temp) * (1 - Math.exp(-dt / tau));
  let alarm = state.alarm;
  if (!alarm && temp > MODEL.alarmOn) alarm = true;
  else if (alarm && temp < MODEL.alarmOff) alarm = false;
  return { temp: clampM(temp, 0, 1), alarm };
}

// the thermostat poppet: stuck closed means it never lifts
const thermoLift = (faults, temp) => (faults.stuck ? 0 : clampM(0.15 + (temp - 0.36) * 4, 0.15, 1));

// the one-line reading. It uses what a person could see: the tell-tale, the alarm, the trend, and whether the intake is
// plainly choked with weeds or a bag. Every overheat line carries the response, and none tells anyone to run or idle the motor to test.
function reading(faults, throttle, time, temp, alarm, trend = 0) {
  const here = pumpFraction(faults, rpmOf(throttle), time);
  const tell = tellWord(here);
  const hot = alarm || temp >= MODEL.rising;
  const act = "reduce throttle, shut down if the alarm stays on, and have it checked";
  if (tell === "None") return "No stream: shut down now and check the intake and the pump.";
  if (tell === "Strong" && !hot) return "Strong tell-tale, steady temperature: looks normal. The stream alone does not prove it.";
  if (tell === "Strong" && trend < -0.012) return "Strong tell-tale and the temperature is coming back down: cooling is recovering. If the alarm stays on, shut down.";
  if (tell === "Strong") return "Strong tell-tale but overheating: reduce throttle, shut down if the alarm stays on, and have the thermostat checked.";
  if (faults.blocked) return hot ? "Weak tell-tale with weeds or a bag over the intake: reduce throttle, shut down if the alarm stays on, and clear the intake." : "Weak tell-tale with weeds or a bag over the intake: shut down and clear it.";
  return hot ? `Weak tell-tale with a clear intake: suspect the impeller. ${act[0].toUpperCase()}${act.slice(1)} before the next run.` : "Weak tell-tale with a clear intake: suspect the impeller. Have it checked before the next run.";
}

// Small polygon-mesh painter used by the Command Thrust figure.
// Everything here is plain functions so the same source runs at build time and inline in the page
// (build.mjs strips the imports/exports and wraps it, like the arcade example does with lathe.mjs).



const TWO_PI = Math.PI * 2;
const key3 = (p) => `${Math.round(p[0] * 50)},${Math.round(p[1] * 50)},${Math.round(p[2] * 50)}`;

// A face is {p: [[x,y,z]...], n: unit normal (outward), e: edge tone for per-face stroke or undefined}
function faceOf(points, hint, extra = {}) {
  let n = [0, 0, 0];
  for (let i = 0; i < points.length; i++) {
    const a = points[i];
    const b = points[(i + 1) % points.length];
    n[0] += (a[1] - b[1]) * (a[2] + b[2]);
    n[1] += (a[2] - b[2]) * (a[0] + b[0]);
    n[2] += (a[0] - b[0]) * (a[1] + b[1]);
  }
  n = unit3(n);
  if (hint && dot3(n, hint) < 0) n = mul3(n, -1);
  return { p: points, n, ...extra };
}

function rotate(p, o, a, angle) {
  const c = Math.cos(angle);
  const s = Math.sin(angle);
  const d = sub3(p, o);
  const k = cross3(a, d);
  const f = dot3(a, d) * (1 - c);
  return [o[0] + d[0] * c + k[0] * s + a[0] * f, o[1] + d[1] * c + k[1] * s + a[1] * f, o[2] + d[2] * c + k[2] * s + a[2] * f];
}

const pointAt = (F, s, r, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [
    F.o[0] + F.a[0] * s + r * (c * F.u[0] + n * F.v[0]),
    F.o[1] + F.a[1] * s + r * (c * F.u[1] + n * F.v[1]),
    F.o[2] + F.a[2] * s + r * (c * F.u[2] + n * F.v[2]),
  ];
};
const radialAt = (F, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [c * F.u[0] + n * F.v[0], c * F.u[1] + n * F.v[1], c * F.u[2] + n * F.v[2]];
};
const tangentAt = (F, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [-n * F.u[0] + c * F.v[0], -n * F.u[1] + c * F.v[1], -n * F.u[2] + c * F.v[2]];
};
const frameFor = (o, a, u) => ({ o, a, u, v: cross3(a, u) });

// ---------------------------------------------------------------- painter
// opts.edge: "feature" (silhouette + creases, drawn right after each face; good for static meshes)
//            "stroke"  (one path per face, optionally stroked: cheap, for per-frame meshes)
//            "none"
function meshSvg(faces, P, { edge = "feature", tone = "hi", crease = "lo", creaseAngle = 0.55, lit = false, strokeAll = false, clip = null, smooth = null } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const cosCrease = Math.cos(creaseAngle);
  const visible = faces.map((f) => dot3(f.n, V) > 1e-6);
  let neighbours = null;
  if (edge === "feature") {
    neighbours = new Map();
    faces.forEach((f, index) => {
      f.p.forEach((a, i) => {
        const b = f.p[(i + 1) % f.p.length];
        const ka = key3(a);
        const kb = key3(b);
        const k = ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
        const list = neighbours.get(k);
        if (list) list.push(index);
        else neighbours.set(k, [index]);
      });
    });
  }
  const order = [];
  for (let i = 0; i < faces.length; i++) {
    if (!visible[i]) continue;
    const f = faces[i];
    let depth = 0;
    for (const q of f.p) depth += dot3(q, V);
    order.push([depth / f.p.length, i]);
  }
  order.sort((x, y) => x[0] - y[0]);
  const out = [];
  for (const [, i] of order) {
    const f = faces[i];
    const clipAttr = clip && clip(f) ? ` clip-path="url(#${clip(f)})"` : "";
    const d = pathOf(f.p.map((q) => iso(q, P)), true);
    if (smooth) {
      // continuous tone: one colour-mix per face, stroked in the same colour so seams close
      const ramp = smooth[f.r] || smooth.base;
      const v = dot3(f.n, L) + (f.t || 0);
      const t = Math.max(0, Math.min(1, (v + 0.32) / 1.08));
      const pct = Math.round((t * t * (3 - 2 * t) * 0.35 + t * 0.65) * 100);
      const col = `color-mix(in srgb,${ramp[1]} ${pct}%,${ramp[0]})`;
      out.push(`<path class="ct-sm" style="fill:${col};stroke:${col}"${clipAttr} d="${d}"/>`);
    } else {
      let band = bandOf(dot3(f.n, L));
      if (f.s) band = Math.max(0, Math.min(4, band + f.s));
      const cls = band === 4 ? "iso-top" : "iso-shade";
      const stroke = f.e || (strokeAll ? tone : null);
      out.push(`<path class="${cls}"${band === 4 ? "" : ` data-shade="${band}"`}${stroke ? ` data-e="${f.e || tone}"` : ""}${f.m ? ` data-m="${f.m}"` : ""}${clipAttr} d="${d}"/>`);
    }
    if (edge === "feature") {
      const silhouette = [];
      const creases = [];
      f.p.forEach((a, k) => {
        const b = f.p[(k + 1) % f.p.length];
        const ka = key3(a);
        const kb = key3(b);
        const list = neighbours.get(ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`);
        const seg = `M${iso(a, P).map((v) => v.toFixed(1)).join(" ")}L${iso(b, P).map((v) => v.toFixed(1)).join(" ")}`;
        if (list.length === 1) silhouette.push(seg);
        else if (list.length === 2) {
          const other = list[0] === i ? list[1] : list[0];
          if (!visible[other]) silhouette.push(seg);
          else if (dot3(faces[other].n, f.n) < cosCrease) creases.push(seg);
        }
      });
      if (silhouette.length) out.push(`<path class="iso-line" data-tone="${tone}"${clipAttr} d="${silhouette.join("")}"/>`);
      if (creases.length) out.push(`<path class="iso-line" data-tone="${crease}"${clipAttr} d="${creases.join("")}"/>`);
    }
  }
  return `<g class="iso-solid${lit ? " m-lit" : ""}" data-seamless>${out.join("")}</g>`;
}

// ---------------------------------------------------------------- builders
// Surface of revolution with a wall. profile = [[s, r], ...] outer radius along the frame axis.
// Angles run a0..a1 (radians); inner radius = r - wall. Returns faces tagged with .k = "out" | "in" | "rim" | "cap".
function shellFaces(F, profile, a0, a1, steps, wall, { sharp = false } = {}) {
  const faces = [];
  const inner = profile.map(([s, r]) => [s, Math.max(0.4, r - wall)]);
  const ang = (j) => a0 + ((a1 - a0) * j) / steps;
  for (let i = 0; i < profile.length - 1; i++) {
    for (let j = 0; j < steps; j++) {
      const am = (ang(j) + ang(j + 1)) / 2;
      const rad = radialAt(F, am);
      const dr = profile[i + 1][1] - profile[i][1];
      const ds = profile[i + 1][0] - profile[i][0];
      const slope = ds ? -dr / ds : 0;
      const outerHint = add3(rad, mul3(F.a, slope));
      faces.push(
        faceOf(
          [pointAt(F, profile[i][0], profile[i][1], ang(j)), pointAt(F, profile[i][0], profile[i][1], ang(j + 1)), pointAt(F, profile[i + 1][0], profile[i + 1][1], ang(j + 1)), pointAt(F, profile[i + 1][0], profile[i + 1][1], ang(j))],
          outerHint,
          { k: "out", x: (profile[i][0] + profile[i + 1][0]) / 2, a: am },
        ),
      );
      const di = inner[i + 1][1] - inner[i][1];
      faces.push(
        faceOf(
          [pointAt(F, inner[i][0], inner[i][1], ang(j)), pointAt(F, inner[i][0], inner[i][1], ang(j + 1)), pointAt(F, inner[i + 1][0], inner[i + 1][1], ang(j + 1)), pointAt(F, inner[i + 1][0], inner[i + 1][1], ang(j))],
          mul3(add3(rad, mul3(F.a, ds ? -di / ds : 0)), -1),
          { k: "in", x: (profile[i][0] + profile[i + 1][0]) / 2, a: am },
        ),
      );
    }
    // rim strips at each cut plane
    for (const [angle, sign] of [[a0, -1], [a1, 1]]) {
      if (Math.abs(a1 - a0 - TWO_PI) < 1e-6) continue;
      faces.push(
        faceOf(
          [pointAt(F, profile[i][0], profile[i][1], angle), pointAt(F, profile[i + 1][0], profile[i + 1][1], angle), pointAt(F, inner[i + 1][0], inner[i + 1][1], angle), pointAt(F, inner[i][0], inner[i][1], angle)],
          mul3(tangentAt(F, angle), sign),
          { k: "rim", x: (profile[i][0] + profile[i + 1][0]) / 2, a: angle },
        ),
      );
    }
  }
  // end annuli
  for (const [idx, sign] of [[0, -1], [profile.length - 1, 1]]) {
    for (let j = 0; j < steps; j++) {
      faces.push(
        faceOf(
          [pointAt(F, profile[idx][0], profile[idx][1], ang(j)), pointAt(F, profile[idx][0], profile[idx][1], ang(j + 1)), pointAt(F, inner[idx][0], inner[idx][1], ang(j + 1)), pointAt(F, inner[idx][0], inner[idx][1], ang(j))],
          mul3(F.a, sign),
          { k: "cap", x: profile[idx][0], a: (ang(j) + ang(j + 1)) / 2 },
        ),
      );
    }
  }
  return faces;
}

// Closed polygonal cylinder (shaft, hub, collar) along frame axis, from s0 to s1, with sides n.
function cylFaces(F, s0, s1, r, n = 10, phase = 0, { r1 = r, caps = true, tag } = {}) {
  const faces = [];
  for (let j = 0; j < n; j++) {
    const a = phase + (j / n) * TWO_PI;
    const b = phase + ((j + 1) / n) * TWO_PI;
    const m = (a + b) / 2;
    faces.push(faceOf([pointAt(F, s0, r, a), pointAt(F, s0, r, b), pointAt(F, s1, r1, b), pointAt(F, s1, r1, a)], add3(radialAt(F, m), mul3(F.a, (r - r1) / Math.max(1e-6, s1 - s0))), { k: tag }));
  }
  if (caps) {
    faces.push(faceOf(Array.from({ length: n }, (_, j) => pointAt(F, s0, r, phase + (j / n) * TWO_PI)), mul3(F.a, -1), { k: tag }));
    faces.push(faceOf(Array.from({ length: n }, (_, j) => pointAt(F, s1, r1, phase + (j / n) * TWO_PI)), F.a, { k: tag }));
  }
  return faces;
}

// Extrude a 2D polygon (in the frame's u,v plane) from s0 to s1 along the axis.
function prismFaces(F, polygon, s0, s1, { tag } = {}) {
  const faces = [];
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const n = polygon.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const [ax, ay] = polygon[i];
    const [bx, by] = polygon[(i + 1) % n];
    area += ax * by - bx * ay;
  }
  const ring = area < 0 ? [...polygon].reverse() : polygon;
  for (let i = 0; i < n; i++) {
    const [x0, y0] = ring[i];
    const [x1, y1] = ring[(i + 1) % n];
    const hint = add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0)));
    faces.push(faceOf([at(s0, ring[i]), at(s0, ring[(i + 1) % n]), at(s1, ring[(i + 1) % n]), at(s1, ring[i])], hint, { k: tag }));
  }
  faces.push(faceOf(ring.map((p) => at(s0, p)), mul3(F.a, -1), { k: tag }));
  faces.push(faceOf(ring.map((p) => at(s1, p)), F.a, { k: tag }));
  return faces;
}

// Axis-aligned box as faces.
function boxFaces(x0, y0, z0, x1, y1, z1, { tag } = {}) {
  const c = (x, y, z) => [x, y, z];
  return [
    faceOf([c(x0, y0, z1), c(x1, y0, z1), c(x1, y1, z1), c(x0, y1, z1)], [0, 0, 1], { k: tag }),
    faceOf([c(x0, y0, z0), c(x1, y0, z0), c(x1, y1, z0), c(x0, y1, z0)], [0, 0, -1], { k: tag }),
    faceOf([c(x1, y0, z0), c(x1, y1, z0), c(x1, y1, z1), c(x1, y0, z1)], [1, 0, 0], { k: tag }),
    faceOf([c(x0, y0, z0), c(x0, y1, z0), c(x0, y1, z1), c(x0, y0, z1)], [-1, 0, 0], { k: tag }),
    faceOf([c(x0, y1, z0), c(x1, y1, z0), c(x1, y1, z1), c(x0, y1, z1)], [0, 1, 0], { k: tag }),
    faceOf([c(x0, y0, z0), c(x1, y0, z0), c(x1, y0, z1), c(x0, y0, z1)], [0, -1, 0], { k: tag }),
  ];
}

// ---------------------------------------------------------------- bevel gear
// o: apex (shaft crossing), a: unit axis the gear sits along, u: unit direction for angle 0.
// delta: pitch cone half-angle, R0..R1: cone distances of the tooth face, N teeth, phase (rad) rotates about a (right-hand).
function bevelFaces({ o, a, u, N, delta, R0, R1, phase = 0, tooth = 1.1, back = 2.4, hub = 3, hubLen = 5, hubEnd = null, backR = 0.94, tag }) {
  const F = frameFor(o, a, u);
  const sin = Math.sin(delta);
  const cos = Math.cos(delta);
  const faces = [];
  const pitch = TWO_PI / N;
  const at = (R, ang, lift = 0) => {
    const rad = radialAt(F, ang);
    const s = R * cos - lift * sin;
    const r = R * sin + lift * cos;
    return [o[0] + a[0] * s + rad[0] * r, o[1] + a[1] * s + rad[1] * r, o[2] + a[2] * s + rad[2] * r];
  };
  const coneNormal = (ang) => {
    const rad = radialAt(F, ang);
    return [rad[0] * cos - a[0] * sin, rad[1] * cos - a[1] * sin, rad[2] * cos - a[2] * sin];
  };
  const element = (ang) => {
    const rad = radialAt(F, ang);
    return [a[0] * cos + rad[0] * sin, a[1] * cos + rad[1] * sin, a[2] * cos + rad[2] * sin];
  };
  const s0 = R0 * cos;
  const s1 = R1 * cos;
  const r0 = R0 * sin;
  const r1 = R1 * sin;
  // valleys: cone body, N quads
  for (let i = 0; i < N; i++) {
    const a0 = phase + i * pitch;
    const a1 = a0 + pitch;
    faces.push(faceOf([at(R0, a0), at(R0, a1), at(R1, a1), at(R1, a0)], coneNormal((a0 + a1) / 2), { k: tag }));
  }
  // teeth
  const wb = 0.29 * pitch;
  const wt = 0.12 * pitch;
  for (let i = 0; i < N; i++) {
    const c = phase + i * pitch + pitch / 2;
    const h0 = tooth * (R0 / R1);
    const h1 = tooth;
    const cn = coneNormal(c);
    const tan = tangentAt(F, c);
    faces.push(faceOf([at(R0, c - wb), at(R1, c - wb), at(R1, c - wt, h1), at(R0, c - wt, h0)], add3(mul3(tan, -1), mul3(cn, 0.5)), { k: tag, e: "t" }));
    faces.push(faceOf([at(R0, c + wb), at(R1, c + wb), at(R1, c + wt, h1), at(R0, c + wt, h0)], add3(tan, mul3(cn, 0.5)), { k: tag, e: "t" }));
    faces.push(faceOf([at(R0, c - wt, h0), at(R1, c - wt, h1), at(R1, c + wt, h1), at(R0, c + wt, h0)], cn, { k: tag, e: "t" }));
    faces.push(faceOf([at(R1, c - wb), at(R1, c - wt, h1), at(R1, c + wt, h1), at(R1, c + wb)], element(c), { k: tag, e: "t" }));
    faces.push(faceOf([at(R0, c - wb), at(R0, c - wt, h0), at(R0, c + wt, h0), at(R0, c + wb)], mul3(element(c), -1), { k: tag }));
  }
  // back (flat) and thickness behind the teeth, then hub
  const ringAt = (s, r) => Array.from({ length: N }, (_, j) => pointAt(F, s, r, phase + j * pitch));
  faces.push(faceOf(ringAt(s0, r0), mul3(a, -1), { k: tag }));
  faces.push(faceOf(ringAt(s1, r1), a, { k: tag }));
  const bn = Math.max(10, Math.min(N, 16));
  for (let j = 0; j < bn; j++) {
    const a0 = phase + (j / bn) * TWO_PI;
    const a1 = phase + ((j + 1) / bn) * TWO_PI;
    faces.push(faceOf([pointAt(F, s1, r1, a0), pointAt(F, s1, r1, a1), pointAt(F, s1 + back, r1 * backR, a1), pointAt(F, s1 + back, r1 * backR, a0)], radialAt(F, (a0 + a1) / 2), { k: tag }));
  }
  faces.push(faceOf(Array.from({ length: bn }, (_, j) => pointAt(F, s1 + back, r1 * backR, phase + (j / bn) * TWO_PI)), a, { k: tag }));
  faces.push(...cylFaces(F, s1 + back, s1 + back + hubLen, hub, 12, phase, { tag }));
  return faces;
}

// ---------------------------------------------------------------- pulley with timing teeth

// phase: shaft angle in radians (counter-clockwise from above).

  const { Rh, Rv, vanes, zv0, zv1, hubTop } = PUMP;
  const F = frameFor([0, 0, 0], [0, 0, 1], [1, 0, 0]);
  const hub = cylFaces(F, zv0 - 0.8, hubTop, Rh, 14, phase);

// relative water flow (0..1+) in each drawn path, from the model snapshot and the thermostat lift
function flowsOf(snap, lift) {
  const q = snap.pct * (0.18 + 0.82 * snap.rpm);
  const open = snap.pct > 0.001 ? Math.min(1, snap.exit / snap.pct) : 0;
  const tap = MODEL.tapShare;
  const out = { intake: q, duct: q, jacket: q * (tap + (1 - tap) * open), tap: q * tap, out: q * (1 - tap) * open };
  for (let i = 0; i < 6; i++) out["slot" + i] = q;
  out.tellarc = Math.min(1, snap.strength * 1.15);
  out.plume = Math.min(1, out.out * 1.5);
  void lift;
  return out;
}

// thermostat poppet and spring in the housing's cut face; lift 0 = seated (closed), 1 = fully open
const TH = ENG.thermo;
const CH = { x0: TH.x0 + 3.5, x1: TH.x1 - 2, z0: TH.z0 + 1.6, z1: TH.z1 - 1.6 };
const thermoChamber = CH;
function thermoPaths(lift, P, y = 0.07) {
  const zp = CH.z0 + 0.4 + 3.8 * Math.max(0, Math.min(1, lift));
  const cx = (CH.x0 + CH.x1) / 2;
  const pw = 3.6;
  const pt = (x, z) => iso([x, y, z], P);
  const poppet = pathOf([pt(cx - pw, zp), pt(cx + pw, zp), pt(cx + pw, zp + 1.7), pt(cx - pw, zp + 1.7)], true);
  const turns = 5;
  const pts = [pt(cx, zp + 1.7)];
  for (let i = 0; i < turns * 2; i++) pts.push(pt(cx + (i % 2 ? 2.2 : -2.2), zp + 1.7 + ((CH.z1 - zp - 1.7) * (i + 0.5)) / (turns * 2)));
  pts.push(pt(cx, CH.z1));
  return { poppet, spring: pathOf(pts) };
}

// ---------------------------------------------------------------- the underwater discharge: bubbles rising from the prop hub to the surface
const BUBBLES = 9;
// i-th bubble at cycle position u (0..1); returns its 3D centre, a radius in drawing units and a fade 0..1
function bubbleAt(i, u) {
  const rnd = (n) => ((Math.sin((i + 1) * 12.9898 + n * 78.233) * 43758.5453) % 1 + 1) % 1;
  const z0 = EXIT.z + (rnd(1) - 0.5) * 4;
  const rise = (WATER - 1 - z0) * u ** 0.92;
  const sway = Math.sin(u * 9 + rnd(2) * 6) * 1.6 * (0.3 + u);
  const x = EXIT.x + 1.5 + 9 * u ** 1.1 + sway + rnd(3) * 2.2;
  const y = (rnd(4) - 0.5) * 7 * (0.4 + u);
  const r = 1.3 + 1.8 * rnd(5) + 1.1 * u;
  const fade = Math.min(1, u * 8) * Math.min(1, (1 - u) * 6);
  return { p: [x, y, z0 + rise], r, fade };
}
// where the plume breaks the surface
const boilAt = () => [EXIT.x + 12, 0, WATER];

const CFG = {"P":{"origin":[197.6764523104141,395.159055930632],"scale":1.1202033486373193,"azimuth":54,"elevation":32},"WIDTH":520,"HEIGHT":560,"debug":false};
// Live behaviour for the cooling figure. Runs after the kit, lathe, world, model, mesh and rig are inlined above it.
const P = CFG.P;
const { WIDTH, HEIGHT } = CFG;
const stage = document.querySelector(".cf-stage");
const root = stage.closest(".iso-figure");
const svg = stage.querySelector("svg");
const corner = document.querySelector("[data-readout]");
const sayEl = document.querySelector("[data-say]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const q = (selector) => svg.querySelector(selector);
const tiles = {};
for (const el of document.querySelectorAll("[data-stat]")) tiles[el.dataset.stat] = { box: el, value: el.querySelector("[data-v]"), bar: el.querySelector("[data-bar]") };
const readingEl = document.querySelector("[data-reading]");
const buttons = [...document.querySelectorAll("button[data-fault]")];

const els = {
  impeller: q('[data-part="impeller"]'),
  prop: q('[data-part="prop"]'),
  marks: q('[data-part="flywheel-marks"]'),
  poppet: q('[data-part="poppet"] .cf-poppet'),
  spring: q("[data-spring]"),
  needle: q('[data-part="needle"] path'),
  lamp: q('[data-part="lamp"]'),
  glow: q('[data-part="lamp-glow"]'),
  weeds: q('[data-part="weeds"]'),
  strands: q(".cf-strands"),
  lever: q('[data-part="lever"]'),
  tell: q('[data-stream="tell"]'),
  splashTell: q('[data-splash="tell"]'),
};
els.bubbles = [...svg.querySelectorAll('[data-bubble]')];
els.boil = q('[data-boil]');
els.exit = q('[data-exit]');
const flows = [...svg.querySelectorAll("[data-flow]")].map((el) => ({ el, name: el.dataset.flow, travel: 0 }));
const PROPRAMP = { base: ["var(--cf-prop-lo)", "var(--cf-prop-hi)"] };
const NEEDLE_Y = GAUGE.y1 + 2.65 + 0.1;

const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const follow = (value, target, dt, tau) => value + (target - value) * (1 - Math.exp(-dt / tau));
const sstep3 = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const NAMES = { blocked: "Intake blocked", worn: "Worn impeller", stuck: "Thermostat stuck" };

// ---- state
const faults = { blocked: false, worn: false, stuck: false };
let throttle = 0;
let tTarget = 0;
let wear = 0;
let weed = 0;
let clock = 0; // model clock, seconds (drives the worn impeller's contact at idle)
let slow = 1;
let slowTarget = 1;
let phase = 0.3;
let temp = 0.5;
let alarm = false;
let lift = 0.5;
let bubbleClock = 0;
let trend = 0; // temperature change per second, smoothed
let raw = { pct: 1, strength: 1 };
const shown = { pct: 1, exit: 1, strength: 1 };
{
  const first = snapshot(faults, 0, 0, 0.5);
  temp = clamp(first.target, 0, 1);
  lift = thermoLift(faults, temp);
}
let touring = false;
let tourClock = 0;
let tourPhase = -1;
let dragging = false;
let frame = 0;
let last = 0;
let visible = false;
let idleTimer = 0;
let startTimer = 0;
let sayTimer = 0;
let sayPrefix = "";
let lastAlarmSay = -99;
let lastAlarm = false;
let lastLever = -1;
let lastNeedle = -1;
let lastLift = -1;
let lastWeed = -1;
let lastShape = "";
let lastTile = "";
let lastReading = "";

// ---- announcements (aria-live): user actions only, after the numbers have settled
function say(message) {
  sayEl.textContent = "";
  setTimeout(() => (sayEl.textContent = message), 30);
}
function summary() {
  const here = pumpFraction(faults, rpmOf(tTarget), clock);
  return `${engineWord(tTarget)}. Pump flow ${Math.round(here * 100)} percent of healthy. Tell-tale ${tellWord(here).toLowerCase()}. Temperature ${tempWord(temp, alarm).toLowerCase()}. ${reading(faults, tTarget, clock, temp, alarm, trend)}`;
}
function announce(prefix) {
  sayPrefix = prefix;
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => say(`${sayPrefix} ${summary()}`), 1300);
}

function syncButtons() {
  for (const b of buttons) b.setAttribute("aria-pressed", faults[b.dataset.fault] ? "true" : "false");
}

// ---- drawing
function draw(dt) {
  const rpm = rpmOf(throttle);
  const snap = { pct: shown.pct, exit: shown.exit, strength: shown.strength, rpm };
  const fl = flowsOf(snap, lift);
  // water: dashes slide along each path at a speed set by the flow in it
  for (const f of flows) {
    const value = f.name === "tellarc" ? fl.tellarc : fl[f.name] ?? 0;
    const style = flowStyle(value, 0);
    f.travel = (f.travel + (still.matches ? 0 : flowSpeed(value) * dt * slow)) % 7;
    f.el.style.strokeDasharray = style.dash;
    f.el.style.strokeDashoffset = (-f.travel).toFixed(2);
    f.el.style.opacity = style.op.toFixed(2);
  }
  // the two free streams: length and strength from the model
  const tellSpeed = fl.tellarc;
  const tellPts = tellTaleArc(tellSpeed);
  const tellD = pathOf(tellPts.map((p) => iso(p, P)));
  els.tell.setAttribute("d", tellD);
  for (const f of flows) {
    if (f.name === "tellarc") f.el.setAttribute("d", tellD);
  }
  const tellOn = clamp(tellSpeed * 3.2, 0, 1);
  els.tell.style.opacity = (0.55 * tellOn).toFixed(2);
  els.tell.style.strokeWidth = (0.7 + 1.1 * tellSpeed).toFixed(2);
  const land = (pts) => iso(pts[pts.length - 1], P);
  const [tx, ty] = land(tellPts);
  els.splashTell.setAttribute("cx", tx.toFixed(1));
  els.splashTell.setAttribute("cy", ty.toFixed(1));
  const pulse = still.matches ? 1 : 0.75 + 0.25 * Math.sin(clock * 9);
  els.splashTell.style.opacity = (0.7 * tellOn * pulse).toFixed(2);
  els.splashTell.setAttribute("rx", (1.5 + 3.5 * tellSpeed).toFixed(1));
  // the underwater discharge: a column of bubbles rising from the prop hub, as many and as fast as the water leaving the powerhead
  const plume = fl.plume;
  const live = clamp(plume * 1.25, 0, 1);
  bubbleClock = (bubbleClock + (still.matches ? 0 : (0.12 + 0.5 * plume) * dt * slow)) % 1;
  els.bubbles.forEach((b, i) => {
    const on = i < Math.ceil(BUBBLES * live) && plume > 0.02;
    const u = still.matches ? (i + 0.5) / BUBBLES : (bubbleClock + i / BUBBLES) % 1;
    const bub = bubbleAt(i, u);
    const [bx, by] = iso(bub.p, P);
    b.setAttribute("cx", bx.toFixed(1));
    b.setAttribute("cy", by.toFixed(1));
    b.setAttribute("r", (bub.r * (0.6 + 0.6 * live)).toFixed(2));
    b.style.opacity = on ? (0.95 * bub.fade).toFixed(2) : "0";
  });
  els.exit.style.opacity = (0.25 + 0.6 * live).toFixed(2);
  els.boil.style.opacity = (0.8 * live * (still.matches ? 1 : 0.65 + 0.35 * Math.sin(clock * 6))).toFixed(2);
  // moving parts: the impeller (its vanes lean and shorten with wear), the prop and the flywheel marks share the crank
  els.impeller.innerHTML = meshSvg(impellerFaces(wear, phase), P, { edge: "stroke", tone: "hi", strokeAll: true });
  els.prop.innerHTML = meshSvg(propOf(phase), P, { edge: "feature", tone: "hi", crease: "faint", smooth: PROPRAMP });
  els.marks.innerHTML = lineSvg(flywheelMarks(phase, P), { tone: "mid" });
  // thermostat poppet
  if (Math.abs(lift - lastLift) > 1e-3) {
    const d = thermoPaths(lift, P);
    els.poppet.setAttribute("d", d.poppet);
    els.spring.setAttribute("d", d.spring);
    lastLift = lift;
  }
  // gauge needle and alarm lamp
  if (Math.abs(temp - lastNeedle) > 5e-4) {
    els.needle.setAttribute("d", needlePath(temp, P, GAUGE, NEEDLE_Y));
    lastNeedle = temp;
  }
  if (alarm) els.lamp.setAttribute("data-on", "");
  else els.lamp.removeAttribute("data-on");
  els.glow.style.opacity = alarm ? (still.matches ? 0.7 : 0.45 + 0.3 * Math.sin(clock * 7)).toFixed(2) : "0";
  // weeds over the intake
  if (Math.abs(weed - lastWeed) > 1e-3) {
    els.weeds.style.opacity = weed.toFixed(2);
    lastWeed = weed;
  }
  els.strands.setAttribute("transform", `translate(${(still.matches ? 0 : 1.1 * Math.sin(clock * 1.7)).toFixed(2)} 0)`);
  // throttle lever
  if (Math.abs(throttle - lastLever) > 1e-4) {
    els.lever.innerHTML = meshSvg(leverFaces(throttle), P, { edge: "feature", tone: "hi", crease: "lo" });
    lastLever = throttle;
  }
  readouts(raw);
}

function readouts(snap) {
  const engine = engineWord(throttle);
  const pct = Math.round(snap.pct * 100);
  const tell = tellWord(snap.pct);
  const word = tempWord(temp, alarm);
  const key = `${engine}|${Math.round(rpmOf(throttle) * 50)}|${pct}|${tell}|${word}|${Math.round(temp * 50)}|${Math.round(snap.strength * 50)}|${slowTarget}`;
  if (key !== lastTile) {
    lastTile = key;
    tiles.engine.value.textContent = engine;
    tiles.engine.bar.style.width = `${(rpmOf(throttle) * 100).toFixed(0)}%`;
    tiles.pump.value.textContent = `${pct}%`;
    tiles.pump.bar.style.width = `${pct}%`;
    tiles.tell.value.textContent = tell;
    tiles.tell.bar.style.width = `${(clamp(snap.strength, 0, 1) * 100).toFixed(0)}%`;
    tiles.temp.value.textContent = word;
    tiles.temp.bar.style.left = `${(temp * 100).toFixed(1)}%`;
    tiles.temp.box.dataset.alarm = alarm ? "on" : "off";
    tiles.tell.box.dataset.level = tell.toLowerCase();
    corner.textContent = `${engine} · flow ${pct}% · ${tell.toLowerCase()}${slowTarget < 1 ? " · slow" : ""}`;
  }
  const line = reading(faults, throttle, clock, temp, alarm, trend);
  if (line !== lastReading) {
    lastReading = line;
    readingEl.textContent = line;
  }
}

// ---- idle tour: healthy, blocked intake, worn impeller, stuck thermostat; the throttle sweeps up and back in each
const TOUR_LEN = 13.5;
const TOUR_SETS = [{}, { blocked: true }, { worn: true }, { stuck: true }];
const tourThrottle = (m) => sstep3(2.6, 5.6, m) - sstep3(8.8, 11.8, m);
function applyTour() {
  const index = Math.floor(tourClock / TOUR_LEN) % TOUR_SETS.length;
  if (index !== tourPhase) {
    tourPhase = index;
    for (const name of Object.keys(faults)) faults[name] = !!TOUR_SETS[index][name];
    // every phase of the tour starts clean: cool engine, no alarm
    temp = 0.5;
    alarm = false;
    lastAlarm = false;
    trend = 0;
    lift = thermoLift(faults, temp);
    syncButtons();
  }
  tTarget = tourThrottle(tourClock % TOUR_LEN);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) {
    tourClock += dt;
    applyTour();
  }
  if (!calm) clock += dt;
  const wearT = faults.worn ? 1 : 0;
  const weedT = faults.blocked ? 1 : 0;
  if (calm) {
    throttle = tTarget;
    wear = wearT;
    weed = weedT;
    slow = slowTarget;
  } else {
    throttle = follow(throttle, tTarget, dt, 0.22);
    wear = follow(wear, wearT, dt, 0.4);
    weed = follow(weed, weedT, dt, 0.5);
    slow = follow(slow, slowTarget, dt, 0.25);
  }
  if (Math.abs(throttle - tTarget) < 1e-4) throttle = tTarget;
  if (Math.abs(wear - wearT) < 1e-3) wear = wearT;
  if (Math.abs(weed - weedT) < 1e-3) weed = weedT;
  const rpm = rpmOf(throttle);
  const snap = snapshot(faults, throttle, clock, temp);
  if (calm) {
    shown.pct = snap.pct;
    shown.exit = snap.exit;
    shown.strength = snap.strength;
  } else {
    shown.pct = follow(shown.pct, snap.pct, dt, 0.25);
    shown.exit = follow(shown.exit, snap.exit, dt, 0.25);
    shown.strength = follow(shown.strength, snap.strength, dt, 0.25);
  }
  raw = snap;
  const state = stepTemp({ temp, alarm }, snap.target, calm ? 100 : dt);
  trend = calm ? 0 : follow(trend, (state.temp - temp) / dt, dt, 0.8);
  temp = state.temp;
  alarm = state.alarm;
  if (alarm !== lastAlarm) {
    lastAlarm = alarm;
    if (!touring && clock - lastAlarmSay > 8) {
      lastAlarmSay = clock;
      say(alarm ? "Overheat alarm on." : "Overheat alarm off.");
    }
  }
  lift = calm ? thermoLift(faults, temp) : follow(lift, thermoLift(faults, temp), dt, 0.4);
  if (!calm) phase += (1.4 + 7.5 * rpm) * dt * slow;
  draw(calm ? 0 : dt);
  const settled = calm && !dragging;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

// ---- interaction
const anyFault = () => faults.blocked || faults.worn || faults.stuck;
function resumeLater() {
  clearTimeout(idleTimer);
  clearTimeout(startTimer);
  // after a person has left a fault switched on, give them longer to look before the tour takes over
  idleTimer = setTimeout(() => {
    if (still.matches || dragging) return;
    touring = true;
    tourClock = 0;
    tourPhase = -1;
    run();
  }, anyFault() ? 14000 : 3600);
}
function interact() {
  touring = false;
  resumeLater();
}
function steer(share, quiet) {
  interact();
  tTarget = clamp(share, 0, 1);
  stage.setAttribute("aria-valuenow", String(Math.round(tTarget * 100)));
  stage.setAttribute("aria-valuetext", engineWord(tTarget));
  if (!quiet) announce("Throttle changed.");
  run();
}
function toggle(name) {
  interact();
  faults[name] = !faults[name];
  syncButtons();
  announce(`${NAMES[name]} ${faults[name] ? "on" : "off"}.`);
  resumeLater();
  run();
}

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

for (const b of buttons) b.addEventListener("click", () => toggle(b.dataset.fault));

// ---- the numbered legend: hover, focus or tap an item to light that part up on the drawing; a tap or click pins it, Escape clears it
const legs = [...document.querySelectorAll(".cf-leg")];
let pinned = "";
const light = (n) => {
  if (n) svg.dataset.hl = n;
  else delete svg.dataset.hl;
};
const syncLegs = () => legs.forEach((b) => b.setAttribute("aria-pressed", b.dataset.hl === pinned ? "true" : "false"));
for (const b of legs) {
  b.addEventListener("pointerenter", (event) => {
    if (event.pointerType === "mouse") light(b.dataset.hl);
  });
  b.addEventListener("pointerleave", (event) => {
    if (event.pointerType === "mouse") light(pinned);
  });
  b.addEventListener("focus", () => light(b.dataset.hl));
  b.addEventListener("blur", () => light(pinned));
  b.addEventListener("click", () => {
    pinned = pinned === b.dataset.hl ? "" : b.dataset.hl;
    syncLegs();
    light(pinned);
    interact();
  });
}
root.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && pinned) {
    pinned = "";
    syncLegs();
    light("");
  }
});
root.addEventListener("focusin", () => {
  if (touring) interact();
});

// ---- the lever: drag by angle around its pivot
const pv = leverPivot();
const pivotAt = iso([pv[0], pv[1] - 1.2, pv[2]], P);
const o = iso([0, 0, 0], P);
const axisX = [iso([1, 0, 0], P)[0] - o[0], iso([1, 0, 0], P)[1] - o[1]];
const axisZ = [iso([0, 0, 1], P)[0] - o[0], iso([0, 0, 1], P)[1] - o[1]];
const det = axisX[0] * axisZ[1] - axisZ[0] * axisX[1];
const boxOf = (event) => {
  const box = svg.getBoundingClientRect();
  return [((event.clientX - box.left) / box.width) * WIDTH, ((event.clientY - box.top) / box.height) * HEIGHT];
};
const shareAt = ([px, py]) => {
  const dx = px - pivotAt[0];
  const dy = py - pivotAt[1];
  const wx = (dx * axisZ[1] - axisZ[0] * dy) / det;
  const wz = (axisX[0] * dy - dx * axisX[1]) / det;
  const degrees = (Math.atan2(-wx, wz) * 180) / Math.PI;
  return (LEVER.from - degrees) / LEVER.span;
};
const grab = stage.querySelector(".cf-grab");
stage.addEventListener("pointerdown", (event) => {
  if (!grab.contains(event.target)) return;
  dragging = true;
  stage.dataset.drag = "";
  stage.setPointerCapture(event.pointerId);
  stage.focus({ preventScroll: true });
  steer(shareAt(boxOf(event)), true);
  event.preventDefault();
});
stage.addEventListener("pointermove", (event) => {
  if (dragging) steer(shareAt(boxOf(event)), true);
});
const release = (event) => {
  if (!dragging) return;
  dragging = false;
  delete stage.dataset.drag;
  try {
    stage.releasePointerCapture(event.pointerId);
  } catch (error) {}
  announce("Throttle changed.");
  resumeLater();
  run();
};
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);

// ---- keys: arrows on the stage; 1 2 3 and S anywhere in the card
root.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const key = event.key;
  const onStage = event.target === stage;
  const step = event.shiftKey ? 0.25 : 0.1;
  if (onStage && (key === "ArrowUp" || key === "ArrowRight")) steer(tTarget + step);
  else if (onStage && (key === "ArrowDown" || key === "ArrowLeft")) steer(tTarget - step);
  else if (onStage && key === "Home") steer(0);
  else if (onStage && key === "End") steer(1);
  else if (key === "1") toggle("blocked");
  else if (key === "2") toggle("worn");
  else if (key === "3") toggle("stuck");
  else if (key === "s" || key === "S") {
    interact();
    slowTarget = slowTarget === 1 ? 0.18 : 1;
    lastTile = "";
    say(slowTarget === 1 ? "Normal speed." : "Slow motion.");
    run();
  } else return;
  event.preventDefault();
});

draw(0);
if (!still.matches) {
  startTimer = setTimeout(() => {
    touring = true;
    tourClock = 0;
    tourPhase = -1;
    run();
  }, 1400);
}
if (CFG.debug) window.__cf = { faults, get throttle() { return tTarget; }, get temp() { return temp; }, get alarm() { return alarm; }, get touring() { return touring; }, get shown() { return shown; }, pivotAt, steer, toggle };
</script></body></html>
